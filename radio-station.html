<!doctype html>
<html lang="en-ZW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TrackHype">
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
  </script>
  <link rel="icon" type="image/webp" href="Assets/logos/TrackHype Logo Design Badge.webp">
  <link rel="apple-touch-icon" href="Assets/logos/TrackHype-Logo-192.png">
  <title>Radio Station — TrackHype</title>

  <meta property="og:title" content="Radio Station - TrackHype">
  <meta property="og:description" content="Radio station profile on TrackHype - chart shows, sponsors and playlists.">
  <meta property="og:image" content="Assets/logos/TrackHype Logo Design Badge.webp">
  <meta property="og:url" content="https://trackhype.github.io/trackhype/radio-station.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="trackhype.css">
</head>
<body data-active-nav="radio-charts.html">

  <header class="th-header" data-app-header>
    <div class="th-header-inner">
      <a class="th-brand" href="index.html">
        <img class="th-logo-badge" src="Assets/logos/TrackHype Logo Design Badge.webp" alt="TrackHype">
        <img class="th-logo-text" src="Assets/logos/track-hype-text-logo.webp" alt="TrackHype">
      </a>
    </div>
  </header>

  <main class="th-app">
    <div class="th-shell">
      <div class="th-section"><div class="th-advert th-advert--full" data-ad-slot="radio-sponsor"><img src="Assets/Demo Media/DemoMedia - Paid Promo.webp" alt="Powered by a TrackHype sponsor"></div></div>
      <section id="stationView"></section>
    </div>
  </main>

  <div class="bottom-swipe" data-bottom-swipe>
    <nav class="bottom-nav" data-bottom>
      <div class="bottom-nav-inner" data-nav-host></div>
    </nav>

    <aside class="promo-player" data-player></aside>
  </div>

  <div class="th-modal-backdrop" data-modal>
    <div class="th-sheet" role="dialog" aria-modal="true">
      <div class="th-sheet-handle"></div>
      <h3 data-modal-title></h3>
      <div data-modal-body></div>
      <div class="th-sheet-actions" data-modal-actions></div>
    </div>
  </div>

  <script src="demo-playlist.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/tracker.js"></script>
<script src="trackhype.js"></script>
  <script src="radio-data.js"></script>
  <script>
    function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    (function(){
      var param = new URLSearchParams(location.search).get("station") || "";
      var station = (window.RADIO_STATIONS || []).find(function(s){ return s.id === param; });
      var host = document.getElementById("stationView");

      if(!station){
        host.innerHTML = '<div class="th-empty"><strong>Station not found</strong>This radio station could not be found.</div>';
        return;
      }

      var charts = window.RADIO_CHARTS ? (window.RADIO_CHARTS[station.id] || []) : [];
      var metaParts = [];
      if(station.freq && station.freq !== "–") metaParts.push(station.freq);
      metaParts.push(station.region);

      var html =
        '<div class="radio-station-hero">' +
          '<img loading="lazy" src="' + station.logo + '" alt="' + esc(station.name) + '" onerror="this.style.visibility=\'hidden\'">' +
          '<div class="rsh-name">' + esc(station.name) + '</div>' +
          '<div class="rsh-meta">' + esc(metaParts.join(" · ")) + '</div>' +
          '<div class="rsh-focus">' + esc(station.focus) + '</div>' +
        '</div>';

      if(!charts.length){
        html += '<div class="th-empty" style="margin-top:16px"><strong>No charts yet</strong>Charts for this station are coming soon.</div>';
      } else {
        html += '<div class="rcc-list">' +
          charts.map(function(c, i){
            return '<div class="radio-chart-card">' +
              '<img class="rcc-art" loading="lazy" src="Assets/radio-charts/DemoMedia - Radio Chart Artwork.webp" alt="' + esc(c.title) + '" onclick="toggleChart(' + i + ')">' +
              '<div class="rcc-head"><h3 class="rcc-title">' + esc(c.title) + '</h3></div>' +
              '<div class="rcc-info" onclick="openChartPage()">' +
                '<div class="rcc-row"><b>Day:</b> ' + esc(c.day) + '</div>' +
                '<div class="rcc-row"><b>Songs:</b> ' + esc(c.songs) + '</div>' +
                '<div class="rcc-row"><b>Presenter(s):</b> ' + esc(c.presenter) + '</div>' +
                '<div class="rcc-row"><b>Sponsor:</b> ' + esc(c.sponsor) + '</div>' +
                '<p class="rcc-desc">' + esc(c.info) + '</p>' +
                '<div class="rcc-open">Open</div>' +
              '</div>' +
            '</div>';
          }).join("") + '</div>';
      }

      host.innerHTML = html;
    })();

    window.toggleChart = function(i){
      var cards = document.querySelectorAll(".radio-chart-card");
      var card = cards[i];
      if(!card) return;
      if(card.classList.contains("is-open")){
        card.classList.remove("is-open");
      } else {
        for(var j = 0; j < cards.length; j++){ cards[j].classList.remove("is-open"); }
        card.classList.add("is-open");
      }
    };
    window.openChartPage = function(){
      TrackHype.navigate("charts.html");
    };
  </script>
</body>
</html>
