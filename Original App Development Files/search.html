<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackHype — Search</title><link rel="stylesheet" href="trackhype.css"></head><body>
<header class="app-header" id="appHeader"><div class="header-row"><div class="brand">TRACKHYPE</div><div class="spacer"></div><button class="head-btn" onclick="nav('menu.html')">☰</button></div></header>
<main class="container"><div class="hero"><h1>Search</h1><p>Find anything across TrackHype — songs, artists, charts, genres and lyrics.</p></div><div class="card"><input id="q" class="searchbox" placeholder="Search songs, artists, charts, genres or lyrics…" oninput="runSearch()"></div><div class="tabs"><button class="tab active" onclick="setType('all',this)">All</button><button class="tab" onclick="setType('songs',this)">Songs</button><button class="tab" onclick="setType('artists',this)">Artists</button><button class="tab" onclick="setType('charts',this)">Charts</button></div><div id="results"></div></main>
<div class="bottom-system"><div class="bottom-player" id="bottomPlayer"><img class="player-thumb" id="playerThumb" src="Assets/Charts/top_40_chart/1.jpg"><button class="player-btn player-main" id="playBtn" onclick="togglePlay()">▶</button><button class="player-btn" id="playlistBtn">♫</button><div class="progress"></div><button class="player-btn" id="bottomToggle">□</button></div><nav class="nav" id="bottomNav"><button data-nav="index.html">Hyped</button><button data-nav="history.html">History</button><button data-nav="artists.html">Artists</button><button data-nav="search.html">Search</button><button data-nav="menu.html">Menu</button></nav></div><div class="sheet-overlay" id="playlistOverlay"><div class="sheet"><div class="sheet-head"><strong>Playlist</strong><button class="close" onclick="closePlaylist()">Close</button></div><div id="playlistList"></div></div></div>
<script src="trackhype.js"></script><script>let currentType='all';const data=[['songs','uValo','JAZZWRLD','Song'],['songs','Zim Dreams','Feli Nandi','Song'],['songs','Mambo','Mambo Dhuterere','Song'],['artists','Winky D','Zimdancehall','Artist'],['artists','Alick Macheso','Sungura','Artist'],['charts','National Top 100','All Genres','Chart'],['charts','Zim Hip Hop Top 20','Zim Hip Hop','Chart'],['charts','Gospel Top 20','Gospel','Chart']];function setType(t,e){currentType=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.classList.add('active');runSearch()}function runSearch(){const q=document.getElementById('q').value.toLowerCase().trim();const r=data.filter(x=>(currentType==='all'||x[0]===currentType)&&(!q||x.join(' ').toLowerCase().includes(q)));document.getElementById('results').innerHTML=r.length?r.map(x=>'<div class="row" style="margin-bottom:10px"><div class="square" style="display:grid;place-items:center;background:#000;color:#fff;font-weight:900">'+x[3][0]+'</div><div class="meta"><div class="title">'+esc(x[1])+'</div><div class="sub">'+esc(x[2])+' · '+x[3]+'</div></div><button class="secondary" onclick="'+(x[3]==='Artist'?`nav('artist.html?artist=${encodeURIComponent(x[1])}')`:x[3]==='Chart'?`nav('charts.html')`:`nav('song.html')`)+'">VIEW</button></div>').join(''):'<div class="card"><div class="title">No results yet</div><div class="sub">Try an artist, song, chart or genre.</div></div>'}initShell('search.html');runSearch();</script></body></html>
