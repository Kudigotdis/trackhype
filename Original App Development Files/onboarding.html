<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackHype — Onboarding</title><link rel="stylesheet" href="trackhype.css"><style>.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{border:1px solid #ddd;background:#fff;padding:11px;border-radius:9px;text-align:left;font-weight:800}.choice.active{background:#d81a1a;color:#fff;border-color:#d81a1a}.status{font-size:12px;color:#777;margin-top:8px}.step{display:none}.step.active{display:block}</style></head><body><main class="container">
<div class="hero"><h1>Welcome to TrackHype</h1><p>Discover Zimbabwean music, follow artists and help shape the charts.</p></div>
<div id="step1" class="step active"><div class="card"><div class="section-title">Your details</div><div style="height:10px"></div><input id="first" placeholder="First name"><div style="height:8px"></div><input id="last" placeholder="Surname"><div style="height:8px"></div><input id="dob" type="date"><div style="height:8px"></div><input id="phone" type="tel" placeholder="+263 mobile number"><div style="height:8px"></div><select id="network"><option value="">Select mobile network</option><option>Econet</option><option>NetOne</option><option>Telecel</option><option>Other</option></select><div style="height:8px"></div><select id="money"><option value="">Mobile money service</option><option>EcoCash</option><option>OneMoney</option><option>TeleCash</option><option>None</option></select></div><button class="primary" style="width:100%" onclick="next(2)">CONTINUE</button></div>
<div id="step2" class="step"><div class="card"><div class="section-title">Choose at least 8 genres</div><div class="status" id="status">0 selected</div><div style="height:10px"></div><div class="choice-grid" id="genres"></div></div><button class="primary" style="width:100%" id="genreNext" onclick="next(3)" disabled>CONTINUE</button></div>
<div id="step3" class="step"><div class="card"><div class="section-title">Artists you like</div><div class="status">Optional — you can change this later.</div><div style="height:10px"></div><div class="choice-grid" id="artists"></div></div><button class="primary" style="width:100%" onclick="finish()">ENTER TRACKHYPE</button><div style="text-align:center;margin-top:10px"><button class="secondary" onclick="finish()">SKIP</button></div></div>
</main><script>const genres=['Zim Hip Hop','Zimdancehall','Sungura','Chimurenga','Amapiano','Zimbabwean House','Afro-Pop','Afro-Fusion','R&B','Gospel','Jazz','Reggae','Dancehall','Mbira','Jiti','Zimbabwean Rumba','Zim EDM','Urban Grooves','Soul','House','Gqom','Kwaito','Gospel Hip Hop','Trap Gospel','Afro-Gospel Rap','Sungura Trap','Zimbabwean Jazz','Imbube','Mbende / Jerusarema'];document.getElementById('genres').innerHTML=genres.map(g=>'<button type="button" class="choice" onclick="pickGenre(this)">'+g+'</button>').join('');document.getElementById('artists').innerHTML=['Winky D','Holy Ten','Alick Macheso','Feli Nandi','Takura','Tino Mungoma','Mambo Dhuterere','ExQ','Saintfloew','Freeman HKD'].map(g=>'<button type="button" class="choice" onclick="this.classList.toggle(\'active\')">'+g+'</button>').join('');function next(n){if(n===2){if(!document.getElementById('first').value.trim()||!document.getElementById('last').value.trim()||!document.getElementById('phone').value.trim())return alert('Please complete your name and mobile number.')}document.querySelectorAll('.step').forEach(x=>x.classList.remove('active'));document.getElementById('step'+n).classList.add('active');window.scrollTo(0,0)}function pickGenre(b){b.classList.toggle('active');const n=document.querySelectorAll('#genres .active').length;document.getElementById('status').textContent=n+' selected'+(n<8?' · '+(8-n)+' more needed':' · ready');document.getElementById('genreNext').disabled=n<8}function finish(){localStorage.setItem('trackhype_onboarding_complete','true');localStorage.setItem('trackhype_genres',JSON.stringify([...document.querySelectorAll('#genres .active')].map(x=>x.textContent)));location.href='index.html'}</script></body></html>
