<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackHype — Charts</title>
<style>
:root{--brand-red:#d81a1a;--brand-black:#000;--brand-white:#fff;--app-bg:#f0f0f0;--text:#333;--muted:#777;--border:#ddd}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:'Segoe UI',Roboto,sans-serif;background:var(--app-bg);color:var(--text);padding:20px 10px 150px}
button{font:inherit}.app-header{position:sticky;top:0;z-index:120;background:var(--brand-black);color:#fff;padding:11px 14px;margin:-20px -10px 20px;transition:transform .25s ease;box-shadow:0 2px 8px rgba(0,0,0,.18)}.app-header.hidden{transform:translateY(-110%)}.header-row{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:1px}.header-spacer{flex:1}.header-icon{width:34px;height:34px;border:1px solid #444;background:#111;color:#fff;border-radius:8px;display:grid;place-items:center}
.chart-header-card{background:#fff;border-radius:12px;padding:15px;display:flex;align-items:center;gap:15px;margin:0 auto 20px;box-shadow:0 4px 10px rgba(0,0,0,.05);max-width:760px}.chart-header-img{width:80px;height:80px;border-radius:8px;object-fit:cover;background:#ddd;border:1px solid #eee;flex-shrink:0}.chart-header-info{display:flex;flex-direction:column;gap:4px;min-width:0}.chart-header-title{font-size:20px;font-weight:bold;color:#000}.chart-header-genre{font-size:13px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px}.chart-header-date{font-size:12px;color:#999}.chart-fav-heart{width:24px;height:24px;cursor:pointer;margin-left:auto;flex-shrink:0}
.chart-list{max-width:760px;margin:0 auto;padding-bottom:20px}.chart-card{background:#fff;margin-bottom:10px;border-radius:8px;position:relative;box-shadow:0 2px 4px rgba(0,0,0,.05);overflow:hidden}.chart-row{display:flex;align-items:center;gap:12px;padding:12px}.chart-rank{width:55px;height:55px;background:var(--brand-red);color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;flex-shrink:0}.chart-thumb{width:55px;height:55px;border-radius:6px;object-fit:cover;background:#eee;flex-shrink:0;border:1px solid #ddd;cursor:pointer}.chart-info{flex:1;min-width:0;cursor:pointer;padding-right:8px}.chart-title{font-weight:bold;font-size:15px;color:#000;margin-bottom:4px}.chart-artist{font-size:13px;color:#666}.chart-votes{font-size:12px;font-weight:bold;color:var(--brand-red);margin-left:auto}.expand-panel{display:none;border-top:1px solid #eee}.expand-panel.open{display:block}.youtube-wrap{background:#000;padding:10px}.youtube-frame{width:100%;aspect-ratio:16/9;border:0;display:block}.song-details{padding:14px}.detail-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.detail-btn{border:1px solid #ddd;background:#f7f7f7;border-radius:8px;padding:10px;text-align:center;font-weight:700;font-size:12px}.detail-btn.active{border-color:var(--brand-red);color:var(--brand-red)}.artist-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}.artist-item{display:flex;align-items:center;gap:10px}.artist-portrait{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#ddd}.artist-name{font-weight:700}.artist-role{font-size:12px;color:#777}.lyrics-link{display:inline-block;margin-top:10px;color:var(--brand-red);font-weight:800;text-decoration:none}.vote-grip{font-size:20px;color:#999;padding:4px;cursor:grab;user-select:none}.chart-card.dragging{opacity:.55}.chart-card.drag-over{outline:2px dashed var(--brand-red)}
.vote-banner{display:none;max-width:760px;margin:0 auto 12px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;position:sticky;top:58px;z-index:80;box-shadow:0 4px 12px rgba(0,0,0,.06)}.vote-banner.show{display:block}.vote-banner strong{color:#000}.vote-hint{font-size:12px;color:#777;margin-top:3px}.vote-points{font-size:12px;font-weight:800;color:var(--brand-red)}
.bottom-system{position:fixed;left:10px;right:10px;bottom:10px;z-index:150;max-width:760px;margin:auto}.bottom-player{background:#000;color:#fff;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:transform .25s ease}.bottom-player.hidden{transform:translateY(130%)}.song-thumb{width:42px;height:42px;border-radius:6px;object-fit:cover;background:#222}.player-btn{width:34px;height:34px;border:0;background:#111;color:#fff;border-radius:8px;display:grid;place-items:center}.player-play{background:#fff;color:#000}.player-progress{flex:1;height:4px;background:#444;border-radius:4px;position:relative;cursor:pointer}.player-progress-fill{position:absolute;left:0;top:0;height:100%;width:36%;background:#fff;border-radius:4px}.player-dot{position:absolute;top:50%;left:36%;width:10px;height:10px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}.nav-bar{display:none;background:#fff;border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);grid-template-columns:repeat(5,1fr);gap:5px}.nav-bar.show{display:grid}.nav-item{border:0;background:#fff;padding:10px 4px;border-radius:8px;font-size:11px;font-weight:800}.nav-item.active{background:var(--brand-black);color:#fff}.playlist-overlay,.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:300}.playlist-overlay.open,.modal-overlay.open{display:flex}.playlist-sheet{background:#fff;width:100%;max-width:760px;border-radius:16px 16px 0 0;max-height:80vh;overflow:auto;padding:14px}.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.close-btn{border:0;background:#eee;border-radius:8px;padding:8px 12px}.playlist-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.playlist-item img{width:48px;height:48px;border-radius:6px;object-fit:cover}.playlist-meta{flex:1;min-width:0}.playlist-artist{font-size:12px;font-weight:800}.playlist-title{font-size:13px;color:#555}.playlist-actions{display:flex;gap:8px}.mini-action{border:0;background:#f2f2f2;border-radius:8px;width:32px;height:32px}.bottom-actions{position:fixed;left:50%;transform:translateX(-50%);bottom:85px;width:calc(100% - 20px);max-width:760px;display:flex;gap:10px;z-index:140}.chart-selector-btn,.chart-back-btn,.action-btn{border:0;padding:16px;font-size:15px;font-weight:bold;border-radius:8px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.16)}.chart-selector-btn,.chart-back-btn{background:#000;color:#fff}.chart-selector-btn{flex:0 0 auto}.chart-back-btn{display:none}.action-btn{background:var(--brand-red);color:#fff;flex:1}.modal-content{background:#fff;width:90%;max-width:350px;border-radius:12px;overflow:hidden}.modal-header{padding:16px;background:#f0f0f0;font-weight:bold;text-align:center;border-bottom:1px solid #ddd}.modal-option{width:100%;padding:16px;text-align:left;background:none;border:0;border-bottom:1px solid #eee;font-size:15px;font-weight:500;color:#000}.modal-option:last-child{border-bottom:0}
@media(min-width:700px){.chart-back-btn{display:block}.bottom-actions{bottom:95px}}
</style>
</head>
<body>
<header class="app-header" id="appHeader"><div class="header-row"><div class="brand">TRACKHYPE</div><div class="header-spacer"></div><button class="header-icon" onclick="location.href='search.html'">⌕</button><button class="header-icon" onclick="location.href='menu.html'">☰</button></div></header>

<div class="chart-header-card" id="chartHeaderCard">
<img id="chartCover" src="Assets/Charts/top_40_chart/cover.jpg" class="chart-header-img" onerror="this.style.background='#ddd';this.src='';">
<div class="chart-header-info"><div id="chartTitleText" class="chart-header-title">National Top 40</div><div id="chartGenreText" class="chart-header-genre">All Genres — Zimbabwe</div><div id="chartDateText" class="chart-header-date">Current chart period</div></div>
<img id="chartFavHeart" class="chart-fav-heart" src="Assets/icons/heart_inactive_icon.png" onclick="toggleFav('charts',currentChartKey,this)">
</div>

<div class="vote-banner" id="voteBanner"><strong>Rearrange your chart</strong><div class="vote-hint">Drag any songs into your preferred order. You can move as many songs as you like.</div><div class="vote-points">#1 = 20 points · #20 = 1 point</div></div>
<div class="chart-list" id="chartList"></div>

<div class="bottom-actions"><button class="chart-back-btn" onclick="location.href='index.html'">Back</button><button class="chart-selector-btn" onclick="openChartMenu()">Charts</button><button id="mainActionBtn" class="action-btn" onclick="toggleMode()">VOTE</button></div>

<div class="bottom-system"><div class="bottom-player" id="bottomPlayer"><img id="playerThumb" class="song-thumb" src="Assets/Charts/top_40_chart/1.jpg"><button class="player-btn player-play" id="playBtn" onclick="togglePlay()">▶</button><button class="player-btn" onclick="openPlaylist()">♫</button><div class="player-progress" id="progressBar" onclick="seek(event)"><div class="player-progress-fill" id="progressFill"></div><div class="player-dot" id="progressDot"></div></div><button class="player-btn" onclick="toggleBottomSystem()">□</button></div><nav class="nav-bar" id="bottomNav"><button class="nav-item active" onclick="location.href='charts.html'">Charts</button><button class="nav-item" onclick="location.href='history.html'">History</button><button class="nav-item" onclick="location.href='artists.html'">Artists</button><button class="nav-item" onclick="location.href='search.html'">Search</button><button class="nav-item" onclick="location.href='menu.html'">Menu</button></nav></div>

<div class="playlist-overlay" id="playlistOverlay" onclick="closePlaylist(event)"><div class="playlist-sheet"><div class="sheet-header"><strong>Playlist</strong><button class="close-btn" onclick="closePlaylist()">Close</button></div><div id="playlistList"></div></div></div>
<div class="modal-overlay" id="chartModal" onclick="closeChartMenu(event)"><div class="modal-content"><div class="modal-header">Select a Chart</div><button class="modal-option" onclick="switchChart('top40')">National Top 40</button><button class="modal-option" onclick="switchChart('hiphop')">Zim Hip Hop Top 20</button><button class="modal-option" onclick="switchChart('dancehall')">Zimdancehall Top 20</button><button class="modal-option" onclick="switchChart('gospel')">Zimbabwe Gospel Top 20</button><button class="modal-option" onclick="switchChart('sungura')">Sungura Top 20</button></div></div>

<script>
const APP='trackhype_';
const defaultData={
 top40:{folder:'top_40_chart',title:'National Top 40',genre:'All Genres — Zimbabwe',songs:[
  {id:1,title:'Zimbabwe Sample 01',artist:'Zimbabwe Artist 01',youtube:''},{id:2,title:'Zimbabwe Sample 02',artist:'Zimbabwe Artist 02',youtube:''},{id:3,title:'Zimbabwe Sample 03',artist:'Zimbabwe Artist 03',youtube:''},{id:4,title:'Zimbabwe Sample 04',artist:'Zimbabwe Artist 04',youtube:''},{id:5,title:'Zimbabwe Sample 05',artist:'Zimbabwe Artist 05',youtube:''},{id:6,title:'Zimbabwe Sample 06',artist:'Zimbabwe Artist 06',youtube:''},{id:7,title:'Zimbabwe Sample 07',artist:'Zimbabwe Artist 07',youtube:''},{id:8,title:'Zimbabwe Sample 08',artist:'Zimbabwe Artist 08',youtube:''},{id:9,title:'Zimbabwe Sample 09',artist:'Zimbabwe Artist 09',youtube:''},{id:10,title:'Zimbabwe Sample 10',artist:'Zimbabwe Artist 10',youtube:''},{id:11,title:'Zimbabwe Sample 11',artist:'Zimbabwe Artist 11',youtube:''},{id:12,title:'Zimbabwe Sample 12',artist:'Zimbabwe Artist 12',youtube:''},{id:13,title:'Zimbabwe Sample 13',artist:'Zimbabwe Artist 13',youtube:''},{id:14,title:'Zimbabwe Sample 14',artist:'Zimbabwe Artist 14',youtube:''},{id:15,title:'Zimbabwe Sample 15',artist:'Zimbabwe Artist 15',youtube:''},{id:16,title:'Zimbabwe Sample 16',artist:'Zimbabwe Artist 16',youtube:''},{id:17,title:'Zimbabwe Sample 17',artist:'Zimbabwe Artist 17',youtube:''},{id:18,title:'Zimbabwe Sample 18',artist:'Zimbabwe Artist 18',youtube:''},{id:19,title:'Zimbabwe Sample 19',artist:'Zimbabwe Artist 19',youtube:''},{id:20,title:'Zimbabwe Sample 20',artist:'Zimbabwe Artist 20',youtube:''},{id:21,title:'Zimbabwe Sample 21',artist:'Zimbabwe Artist 21',youtube:''},{id:22,title:'Zimbabwe Sample 22',artist:'Zimbabwe Artist 22',youtube:''},{id:23,title:'Zimbabwe Sample 23',artist:'Zimbabwe Artist 23',youtube:''},{id:24,title:'Zimbabwe Sample 24',artist:'Zimbabwe Artist 24',youtube:''},{id:25,title:'Zimbabwe Sample 25',artist:'Zimbabwe Artist 25',youtube:''},{id:26,title:'Zimbabwe Sample 26',artist:'Zimbabwe Artist 26',youtube:''},{id:27,title:'Zimbabwe Sample 27',artist:'Zimbabwe Artist 27',youtube:''},{id:28,title:'Zimbabwe Sample 28',artist:'Zimbabwe Artist 28',youtube:''},{id:29,title:'Zimbabwe Sample 29',artist:'Zimbabwe Artist 29',youtube:''},{id:30,title:'Zimbabwe Sample 30',artist:'Zimbabwe Artist 30',youtube:''},{id:31,title:'Zimbabwe Sample 31',artist:'Zimbabwe Artist 31',youtube:''},{id:32,title:'Zimbabwe Sample 32',artist:'Zimbabwe Artist 32',youtube:''},{id:33,title:'Zimbabwe Sample 33',artist:'Zimbabwe Artist 33',youtube:''},{id:34,title:'Zimbabwe Sample 34',artist:'Zimbabwe Artist 34',youtube:''},{id:35,title:'Zimbabwe Sample 35',artist:'Zimbabwe Artist 35',youtube:''},{id:36,title:'Zimbabwe Sample 36',artist:'Zimbabwe Artist 36',youtube:''},{id:37,title:'Zimbabwe Sample 37',artist:'Zimbabwe Artist 37',youtube:''},{id:38,title:'Zimbabwe Sample 38',artist:'Zimbabwe Artist 38',youtube:''},{id:39,title:'Zimbabwe Sample 39',artist:'Zimbabwe Artist 39',youtube:''},{id:40,title:'Zimbabwe Sample 40',artist:'Zimbabwe Artist 40',youtube:''}]},
 hiphop:{folder:'zim_hip_hop_top_20',title:'Zim Hip Hop Top 20',genre:'Zim Hip Hop',songs:Array.from({length:20},(_,i)=>({id:i+1,title:`Zim Hip Hop Track ${i+1}`,artist:`Zim Hip Hop Artist ${i+1}`,youtube:''}))},
 dancehall:{folder:'zimdancehall_top_20',title:'Zimdancehall Top 20',genre:'Zimdancehall',songs:Array.from({length:20},(_,i)=>({id:i+1,title:`Zimdancehall Track ${i+1}`,artist:`Zimdancehall Artist ${i+1}`,youtube:''}))},
 gospel:{folder:'zimbabwe_gospel_top_20',title:'Zimbabwe Gospel Top 20',genre:'Gospel',songs:Array.from({length:20},(_,i)=>({id:i+1,title:`Gospel Track ${i+1}`,artist:`Zimbabwe Gospel Artist ${i+1}`,youtube:''}))},
 sungura:{folder:'sungura_top_20',title:'Sungura Top 20',genre:'Sungura',songs:Array.from({length:20},(_,i)=>({id:i+1,title:`Sungura Track ${i+1}`,artist:`Sungura Artist ${i+1}`,youtube:''}))}
};
let currentChartKey=new URLSearchParams(location.search).get('chart')||'top40',currentSongs=[],isVotingMode=false,lastScroll=window.scrollY,navMode=false,currentPlayerIndex=0;
const playerSongs=[{title:'TrackHype Sample',artist:'TrackHype',thumb:'Assets/Charts/top_40_chart/1.jpg',youtube:''}];
function keyVote(){return APP+'vote_'+currentChartKey}function voteState(){try{return JSON.parse(localStorage.getItem(keyVote())||'null')}catch{return null}}
function canVote(){const s=voteState();return !s||Date.now()-s.timestamp>=86400000}
function openChartMenu(){document.getElementById('chartModal').classList.add('open')}function closeChartMenu(e){if(!e||e==='force'||e.target.id==='chartModal')document.getElementById('chartModal').classList.remove('open')}
function switchChart(k){currentChartKey=k;closeChartMenu('force');history.replaceState({},'',`charts.html?chart=${k}`);loadChartData()}
function loadChartData(){const m=defaultData[currentChartKey];document.getElementById('chartCover').src=`Assets/Charts/${m.folder}/cover.jpg`;document.getElementById('chartTitleText').textContent=m.title;document.getElementById('chartGenreText').textContent=m.genre;document.getElementById('chartDateText').textContent='Current chart period';currentSongs=JSON.parse(localStorage.getItem(APP+'order_'+currentChartKey)||'null')||JSON.parse(JSON.stringify(m.songs));isVotingMode=false;renderChart();updateVoteButton()}
function updateVoteButton(){const b=document.getElementById('mainActionBtn'),s=voteState();if(!canVote()){b.textContent='VOTED';b.style.opacity='.6';return}b.textContent=isVotingMode?'SUBMIT VOTE':'VOTE';b.style.opacity='1'}
function toggleMode(){if(!isVotingMode){if(!canVote()){const s=voteState();const hrs=Math.max(0,24-Math.floor((Date.now()-s.timestamp)/3600000));alert(`You have already voted on this chart. Please return after the 24-hour voting window.`);return}isVotingMode=true;document.getElementById('voteBanner').classList.add('show');updateVoteButton();renderChart();window.scrollTo({top:0,behavior:'smooth'})}else submitVote()}
function submitVote(){localStorage.setItem(APP+'order_'+currentChartKey,JSON.stringify(currentSongs));localStorage.setItem(keyVote(),JSON.stringify({timestamp:Date.now(),order:currentSongs.map(s=>s.id),points:currentSongs.map((s,i)=>({songId:s.id,points:currentSongs.length-i}))}));isVotingMode=false;document.getElementById('voteBanner').classList.remove('show');updateVoteButton();renderChart();alert('Your TrackHype vote has been recorded. You may vote on this chart again in 24 hours.')}
function renderChart(){const list=document.getElementById('chartList');list.innerHTML=currentSongs.map((song,index)=>{const rank=index+1;const drag=isVotingMode?`draggable="true" ondragstart="dragStart(event,${index})" ondragover="dragOver(event)" ondrop="dropSong(event,${index})"`:'';return `<article class="chart-card" data-index="${index}" ${drag}><div class="chart-row"><div class="chart-rank">${rank}</div>${isVotingMode?'<div class="vote-grip" title="Drag to reorder">☷</div>':''}<img class="chart-thumb" src="${`Assets/Charts/${defaultData[currentChartKey].folder}/${song.id}.jpg`}" onerror="tryNextExt(this)" onclick="toggleSongPanel(${index},'video')"><div class="chart-info" onclick="toggleSongPanel(${index},'info')"><div class="chart-title">${escapeHtml(song.title)}</div><div class="chart-artist">${escapeHtml(song.artist)}</div></div>${!isVotingMode?`<div class="chart-votes">${rank<=20?(currentSongs.length-rank+1)+' pts':''}</div>`:''}</div><div class="expand-panel" id="panel-${index}"><div id="panel-body-${index}"></div></div></article>`}).join('')}
function toggleSongPanel(index,type){const p=document.getElementById(`panel-${index}`),b=document.getElementById(`panel-body-${index}`);const song=currentSongs[index];const open=p.classList.contains('open');document.querySelectorAll('.expand-panel').forEach(x=>x.classList.remove('open'));if(open)return;if(type==='video'){b.innerHTML=song.youtube?`<div class="youtube-wrap"><iframe class="youtube-frame" src="https://www.youtube-nocookie.com/embed/${extractYouTubeId(song.youtube)}" title="YouTube player" allowfullscreen></iframe></div>`:`<div class="song-details"><strong>YouTube video</strong><div style="color:#777;font-size:13px;margin-top:5px">No YouTube link has been attached to this sample track yet.</div></div>`}else{b.innerHTML=`<div class="song-details"><div style="font-weight:800;font-size:16px">${escapeHtml(song.title)}</div><div style="font-size:13px;color:#777">${escapeHtml(song.artist)}</div><div class="detail-actions"><button class="detail-btn">Apple Music</button><button class="detail-btn">Spotify</button><button class="detail-btn">YouTube</button><button class="detail-btn">Amazon Music</button><button class="detail-btn" onclick="toggleFav('songs','${song.id}',this)">♥ Favourite</button><button class="detail-btn" onclick="location.href='song.html?id=${song.id}&chart=${currentChartKey}'">Lyrics</button></div><div class="artist-list"><div class="artist-item"><img class="artist-portrait" src="Assets/Artists/${song.id}.jpg" onerror="this.style.background='#ddd';this.src=''"><div><div class="artist-name">${escapeHtml(song.artist)}</div><div class="artist-role">Artist</div></div></div></div><a class="lyrics-link" href="song.html?id=${song.id}&chart=${currentChartKey}">VIEW SONG + LYRICS →</a></div>`}p.classList.add('open')}
let dragIndex=null;function dragStart(e,i){dragIndex=i;e.dataTransfer.effectAllowed='move';e.currentTarget.classList.add('dragging')}function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}function dropSong(e,target){e.preventDefault();document.querySelectorAll('.chart-card').forEach(x=>x.classList.remove('drag-over','dragging'));if(dragIndex===null||dragIndex===target)return;const [m]=currentSongs.splice(dragIndex,1);currentSongs.splice(target,0,m);dragIndex=null;renderChart()}
function toggleFav(category,id,el){const k=APP+'fav_'+category;let a=JSON.parse(localStorage.getItem(k)||'[]');const i=a.indexOf(id);if(i>-1){a.splice(i,1);if(el&&el.src)el.src='Assets/icons/heart_inactive_icon.png'}else{a.push(id);if(el&&el.src)el.src='Assets/icons/heart_active_icon.png'}localStorage.setItem(k,JSON.stringify(a))}
function extractYouTubeId(url){try{if(url.includes('youtu.be/'))return url.split('youtu.be/')[1].split('?')[0];return new URL(url).searchParams.get('v')||''}catch{return ''}}
function tryNextExt(img){const src=img.src;if(src.endsWith('.jpg'))return img.src=src.replace('.jpg','.png');if(src.endsWith('.png'))return img.src=src.replace('.png','.webp');img.style.background='#ddd'}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function togglePlay(){const b=document.getElementById('playBtn');b.textContent=b.textContent==='▶'?'❚❚':'▶'}function seek(e){const r=e.currentTarget.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*100;document.getElementById('progressFill').style.width=p+'%';document.getElementById('progressDot').style.left=p+'%'}function toggleBottomSystem(){navMode=!navMode;document.getElementById('bottomPlayer').classList.toggle('hidden',navMode);document.getElementById('bottomNav').classList.toggle('show',navMode)}function openPlaylist(){document.getElementById('playlistList').innerHTML=Array.from({length:8},(_,i)=>`<div class="playlist-item"><img src="Assets/Charts/top_40_chart/${(i%10)+1}.jpg" onerror="tryNextExt(this)"><div class="playlist-meta"><div class="playlist-artist">Zimbabwe Artist ${i+1}</div><div class="playlist-title">TrackHype Playlist Song ${i+1}</div></div><div class="playlist-actions"><button class="mini-action">♥</button><button class="mini-action">↻</button></div></div>`).join('');document.getElementById('playlistOverlay').classList.add('open')}function closePlaylist(e){if(!e||e==='force'||e.target.id==='playlistOverlay')document.getElementById('playlistOverlay').classList.remove('open')}
window.addEventListener('scroll',()=>{const y=window.scrollY,d=y-lastScroll;if(Math.abs(d)<8)return;const h=document.getElementById('appHeader'),p=document.getElementById('bottomPlayer');if(d>0){h.classList.add('hidden');p.classList.add('hidden')}else{h.classList.remove('hidden');p.classList.remove('hidden')}lastScroll=y});
window.addEventListener('beforeunload',()=>{if(isVotingMode){} });window.addEventListener('load',loadChartData);
</script>
</body>
</html>
