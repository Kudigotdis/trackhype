<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackHype — Playlist</title><link rel="stylesheet" href="trackhype.css"></head><body>
<header class="app-header" id="appHeader"><div class="header-row"><button class="head-btn" onclick="history.back()">←</button><div class="brand">TRACKHYPE</div><div class="spacer"></div></div></header>
<main class="container"><div class="hero"><h1>Playlist</h1><p>Your TrackHype listening list. Favourite songs can be kept here for easy access.</p><button class="hero-btn" onclick="playAll()">▶ PLAY ALL</button></div><div class="list" id="fullPlaylist"></div></main>
<div class="bottom-system"><div class="bottom-player" id="bottomPlayer"><img class="player-thumb" id="playerThumb" src="Assets/Charts/top_40_chart/1.jpg"><button class="player-btn player-main" id="playBtn" onclick="togglePlay()">▶</button><button class="player-btn" id="playlistBtn">♫</button><div class="progress"></div><button class="player-btn" id="bottomToggle">□</button></div><nav class="nav" id="bottomNav"><button data-nav="index.html">Hyped</button><button data-nav="history.html">History</button><button data-nav="artists.html">Artists</button><button data-nav="search.html">Search</button><button data-nav="menu.html">Menu</button></nav></div><div class="sheet-overlay" id="playlistOverlay"><div class="sheet"><div class="sheet-head"><strong>Playlist</strong><button class="close" onclick="closePlaylist()">Close</button></div><div id="playlistList"></div></div></div>
<script src="trackhype.js"></script><script>const items=Array.from({length:10},(_,i)=>({artist:['Winky D','Holy Ten','Feli Nandi','Alick Macheso'][i%4],title:['Track '+(i+1),'New Release '+(i+1),'Hyped Song '+(i+1),'Chart Favourite '+(i+1)][i%4],img:'Assets/Charts/top_40_chart/'+((i%10)+1)+'.jpg'}));document.getElementById('fullPlaylist').innerHTML=items.map((s,i)=>'<div class="row"><img class="square" src="'+s.img+'" onerror="this.src=\'\'"/><div class="meta"><div class="title">'+s.artist+'</div><div class="sub">'+s.title+'</div></div><button class="icon-btn" onclick="this.textContent=fav(\'songs\',\''+s.title+'\')?\'♥\':\'♡\'">♡</button><button class="icon-btn" onclick="setPlayer(\''+s.title+'\',\''+s.artist+'\',\''+s.img+'\')">▶</button></div>').join('');function playAll(){if(items[0])setPlayer(items[0].title,items[0].artist,items[0].img)}initShell('');</script></body></html>
