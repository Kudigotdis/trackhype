<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackHype — Artist</title><link rel="stylesheet" href="trackhype.css"></head><body>
<header class="app-header" id="appHeader"><div class="header-row"><button class="head-btn" onclick="history.back()">←</button><div class="brand">TRACKHYPE</div><div class="spacer"></div><button class="head-btn" onclick="nav('search.html')">⌕</button><button class="head-btn" onclick="nav('menu.html')">☰</button></div></header>
<main class="container"><section class="card" id="profile"></section>
<div class="section-head"><div class="section-title">Top Songs</div><a class="section-link" href="charts.html">VIEW CHARTS</a></div><div class="list" id="songs"></div>
<div class="section-head"><div class="section-title">Genres</div></div><div class="card" id="genres"></div>
<div class="section-head"><div class="section-title">Chart History</div><a class="section-link" href="history.html">VIEW HISTORY</a></div><div class="list" id="historyList"></div>
<div class="section-head"><div class="section-title">Artist Links</div></div><div class="grid-2"><button class="secondary">YouTube</button><button class="secondary">Spotify</button><button class="secondary">Apple Music</button><button class="secondary">Instagram</button></div>
</main>
<div class="bottom-system"><div class="bottom-player" id="bottomPlayer"><img class="player-thumb" id="playerThumb" src="Assets/Charts/top_40_chart/1.jpg"><button class="player-btn player-main" id="playBtn" onclick="togglePlay()">▶</button><button class="player-btn" id="playlistBtn">♫</button><div class="progress"></div><button class="player-btn" id="bottomToggle">□</button></div><nav class="nav" id="bottomNav"><button data-nav="index.html">Hyped</button><button data-nav="history.html">History</button><button data-nav="artists.html">Artists</button><button data-nav="search.html">Search</button><button data-nav="menu.html">Menu</button></nav></div>
<div class="sheet-overlay" id="playlistOverlay"><div class="sheet"><div class="sheet-head"><strong>Playlist</strong><button class="close" onclick="closePlaylist()">Close</button></div><div id="playlistList"></div></div></div>
<script src="trackhype.js"></script><script>
const a=new URLSearchParams(location.search).get('artist')||'Zimbabwe Artist';document.getElementById('profile').innerHTML='<div style="display:flex;gap:14px;align-items:center"><img class="avatar" style="width:96px;height:96px" src="Assets/Artists/1.jpg" onerror="this.src=\'\'"/><div class="meta"><div class="title" style="font-size:22px">'+esc(a)+'</div><div class="sub">Zimbabwe · Currently active</div><div style="margin-top:9px"><button class="primary" id="followBtn" onclick="toggleFollow()">FOLLOW</button></div></div></div><p class="sub" style="margin-top:14px;line-height:1.6">Artist profile, approved biography, current activity, genre identity and official links will appear here.</p>';document.getElementById('genres').innerHTML=['Zim Hip Hop','Afro-Fusion','Amapiano'].map(x=>'<span class="pill">'+x+'</span>').join('');document.getElementById('songs').innerHTML=Array.from({length:5},(_,i)=>'<div class="row"><img class="square" src="Assets/Charts/top_40_chart/'+(i+1)+'.jpg" onerror="this.src=\'\'"/><div class="meta"><div class="title">'+esc(a)+' — Track '+(i+1)+'</div><div class="sub">Charting · '+(20-i)+' points</div></div><button class="icon-btn" onclick="nav(\'song.html?id='+(i+1)+'\')">▶</button></div>').join('');document.getElementById('historyList').innerHTML=Array.from({length:6},(_,i)=>'<div class="row"><div class="square" style="display:grid;place-items:center;background:#000;color:#fff;font-weight:900">#'+(i+1)+'</div><div class="meta"><div class="title">Top 20 Chart · Week '+(i+1)+'</div><div class="sub">Peak #'+(i+1)+' · 2026</div></div></div>').join('');function toggleFollow(){const b=document.getElementById('followBtn');b.textContent=b.textContent==='FOLLOW'?'FOLLOWING':'FOLLOW'}initShell('artists.html');
</script></body></html>
