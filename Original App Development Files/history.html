<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackHype — History</title><link rel="stylesheet" href="trackhype.css"></head><body>
<header class="app-header" id="appHeader"><div class="header-row"><div class="brand">TRACKHYPE</div><div class="spacer"></div><button class="head-btn" onclick="nav('search.html')">⌕</button><button class="head-btn" onclick="nav('menu.html')">☰</button></div></header>
<main class="container">
<div class="hero"><h1>Chart History</h1><p>Explore previous TrackHype rankings by date and chart. See what was #1, new entries, biggest climbers and chart staples.</p></div>
<div class="card"><div class="section-title">Choose a date</div><div style="height:10px"></div><input id="date" type="date" value="2026-08-24"><div style="height:10px"></div><div class="section-title">Choose a chart</div><div style="height:8px"></div><select id="chart"><option>National Top 100</option><option>Zim Hip Hop Top 20</option><option>Zimdancehall Top 20</option><option>Sungura Top 20</option><option>Gospel Top 20</option><option>Amapiano Top 20</option><option>Zimbabwean House Top 20</option><option>Afro-Pop Top 20</option></select><div style="height:10px"></div><button class="primary" onclick="loadHistory()">VIEW CHART</button></div>
<div class="tabs"><button class="tab active" onclick="setHistoryTab('chart',this)">Chart</button><button class="tab" onclick="setHistoryTab('highlights',this)">Highlights</button><button class="tab" onclick="setHistoryTab('artists',this)">Artists</button></div>
<div id="historyResults"></div>
</main>
<div class="bottom-system"><div class="bottom-player" id="bottomPlayer"><img class="player-thumb" id="playerThumb" src="Assets/Charts/top_40_chart/1.jpg"><button class="player-btn player-main" id="playBtn" onclick="togglePlay()">▶</button><button class="player-btn" id="playlistBtn">♫</button><div class="progress"></div><button class="player-btn" id="bottomToggle">□</button></div><nav class="nav" id="bottomNav"><button data-nav="index.html">Hyped</button><button data-nav="history.html">History</button><button data-nav="artists.html">Artists</button><button data-nav="search.html">Search</button><button data-nav="menu.html">Menu</button></nav></div>
<div class="sheet-overlay" id="playlistOverlay"><div class="sheet"><div class="sheet-head"><strong>Playlist</strong><button class="close" onclick="closePlaylist()">Close</button></div><div id="playlistList"></div></div></div>
<script src="trackhype.js"></script><script>
const names=['Tino Mungoma','Kudzi Nyakudya','Mambo Dhuterere','Feli Nandi','Takura','Soul Jah Love','Holy Ten','Alick Macheso','ExQ','Winky D'];
function setHistoryTab(tab,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(tab==='chart')loadHistory();if(tab==='highlights')renderHighlights();if(tab==='artists')renderArtists();}
function loadHistory(){const d=document.getElementById('date').value,c=document.getElementById('chart').value;document.getElementById('historyResults').innerHTML='<div class="section-head"><div class="section-title">'+esc(c)+'</div><div class="sub">'+esc(d)+'</div></div><div class="list">'+Array.from({length:20},(_,i)=>'<div class="row"><div class="square" style="display:grid;place-items:center;background:#d81a1a;color:#fff;font-weight:900">'+(i+1)+'</div><img class="square" src="Assets/Charts/top_40_chart/'+((i%10)+1)+'.jpg" onerror="this.src=\'\'"/><div class="meta"><div class="title">Historical Song '+(i+1)+'</div><div class="sub">'+names[i%names.length]+' · '+c+'</div></div><div class="right"><span class="pill">'+(20-i)+' pts</span></div></div>').join('')+'</div>'}
function renderHighlights(){document.getElementById('historyResults').innerHTML='<div class="grid-2"><div class="card"><div class="section-title">#1 Song</div><div class="title" style="margin-top:8px">Historical Song 1</div><div class="sub">'+names[0]+'</div></div><div class="card"><div class="section-title">Biggest Climber</div><div class="title" style="margin-top:8px">Historical Song 7</div><div class="sub">↑ 12 places</div></div><div class="card"><div class="section-title">New Entry</div><div class="title" style="margin-top:8px">Historical Song 15</div><div class="sub">Debut at #15</div></div><div class="card"><div class="section-title">Longest Charting</div><div class="title" style="margin-top:8px">Historical Song 3</div><div class="sub">18 weeks</div></div></div>'}
function renderArtists(){document.getElementById('historyResults').innerHTML='<div class="section-head"><div class="section-title">Artists shaping the chart</div></div><div class="list">'+names.slice(0,8).map((n,i)=>'<div class="row"><img class="avatar" src="Assets/Artists/'+((i%6)+1)+'.jpg" onerror="this.src=\'\'"/><div class="meta"><div class="title">'+esc(n)+'</div><div class="sub">'+(i+1)+' chart appearance'+(i===0?'s':'')+'</div></div><button class="secondary" onclick="nav(\'artist.html?artist='+encodeURIComponent(n)+'\')">VIEW</button></div>').join('')+'</div>'}
initShell('history.html');loadHistory();
</script></body></html>
