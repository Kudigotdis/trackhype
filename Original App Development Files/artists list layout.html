<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackHype — Artists</title>
<link rel="stylesheet" href="trackhype.css">
<style>
 .page-title{font-size:28px;font-weight:900;color:#000;margin:4px 0 4px}.page-sub{font-size:13px;line-height:1.5;color:#666;margin-bottom:14px}
 .filter-card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:14px}.filter-label{font-size:10px;font-weight:900;text-transform:uppercase;color:#777;margin-bottom:7px}
 .filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filter-row + .filter-row{margin-top:8px}
 .sort-note{font-size:11px;color:#777;margin:8px 2px 0}.result-count{font-size:11px;color:#777;font-weight:800;margin-bottom:8px}
 .artist-row{cursor:pointer}.artist-row:active{transform:scale(.995)}.artist-avatar{width:58px;height:58px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:900;flex:none}.artist-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.artist-stats span{font-size:9px;font-weight:900;background:#eee;border-radius:12px;padding:4px 6px}.follow-btn{border:1px solid #000;background:#fff;border-radius:8px;padding:8px;font-size:10px;font-weight:900}.follow-btn.active{background:#000;color:#fff}.az{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}.az button{border:1px solid #ddd;background:#fff;border-radius:7px;min-width:29px;height:29px;font-size:11px;font-weight:900}.az button.active{background:#000;color:#fff;border-color:#000}
</style>
</head>
<body>
<header class="app-header" id="appHeader"><div class="header-row"><div class="brand">TRACKHYPE</div><div class="spacer"></div><button class="head-btn" onclick="nav('search.html')">⌕</button><button class="head-btn" onclick="nav('menu.html')">☰</button></div></header>
<main class="container">
  <div class="page-title">Artists</div>
  <div class="page-sub">Explore Zimbabwean artists by genre, activity, chart performance and the artists you follow.</div>

  <div class="az" id="az"></div>

  <section class="filter-card">
    <div class="filter-label">Filters</div>
    <div class="filter-row"><select id="genre"><option>All Genres</option><option>Zim Hip Hop</option><option>Zimdancehall</option><option>Sungura</option><option>Gospel</option><option>Amapiano</option><option>Afro-Pop</option><option>R&B</option><option>House</option><option>Chimurenga</option><option>Afro-Jazz</option></select><select id="status"><option>All Status</option><option>Charting</option><option>Recently Active</option><option>Following</option></select></div>
    <div class="filter-row"><select id="year"><option>Any Year</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option></select><select id="sort"><option value="alphabetical">A–Z</option><option value="active">Recently Active</option><option value="charting">Charting</option><option value="following">Following</option></select></div>
    <div class="sort-note">You can combine genre, status and year with the sort order.</div>
  </section>

  <div class="result-count" id="resultCount"></div>
  <div class="list" id="artistList"></div>
</main>

<div class="bottom-system"><div class="bottom-player" id="bottomPlayer"><div class="featured-art" id="playerThumb" style="width:42px;height:42px;border-radius:6px;font-size:12px">TH</div><button class="player-btn player-main" id="playBtn" onclick="togglePlay()">▶</button><button class="player-btn" id="playlistBtn">♫</button><div class="progress"></div><button class="player-btn" id="bottomToggle">□</button></div><nav class="nav" id="bottomNav"><button data-nav="index.html">Hyped</button><button data-nav="history.html">History</button><button data-nav="artists.html">Artists</button><button data-nav="search.html">Search</button><button data-nav="menu.html">Menu</button></nav></div>
<div class="sheet-overlay" id="playlistOverlay" onclick="if(event.target.id==='playlistOverlay')closePlaylist()"><div class="sheet"><div class="sheet-head"><strong>Playlist</strong><button class="close" onclick="closePlaylist()">Close</button></div><div id="playlistList"></div></div></div>
<script src="trackhype.js"></script>
<script>
const artists=[
 {name:'Alick Macheso',genre:'Sungura',year:1998,status:['Recently Active'],chart:91,follow:true},
 {name:'Holy Ten',genre:'Zim Hip Hop',year:2019,status:['Charting','Recently Active'],chart:95,follow:true},
 {name:'Feli Nandi',genre:'Afro-Pop',year:2018,status:['Charting','Recently Active'],chart:84,follow:false},
 {name:'Jah Prayzah',genre:'Afro-Pop',year:2005,status:['Charting','Recently Active'],chart:98,follow:true},
 {name:'T Gonzi',genre:'Zim Hip Hop',year:2010,status:['Charting'],chart:88,follow:false},
 {name:'Freeman HKD Boss',genre:'Zimdancehall',year:2012,status:['Charting','Recently Active'],chart:96,follow:true},
 {name:'Tocky Vibes',genre:'Zimdancehall',year:2012,status:['Recently Active'],chart:79,follow:false},
 {name:'Mambo Dhuterere',genre:'Gospel',year:2018,status:['Charting','Recently Active'],chart:89,follow:false},
 {name:'Saintfloew',genre:'Zim Hip Hop',year:2018,status:['Charting','Recently Active'],chart:86,follow:true},
 {name:'Jah Master',genre:'Zimdancehall',year:2018,status:['Recently Active'],chart:83,follow:false},
 {name:'Andy Muridzo',genre:'Afro-Pop',year:2011,status:['Charting'],chart:77,follow:false},
 {name:'Janet Manyowa',genre:'Gospel',year:2010,status:['Recently Active'],chart:82,follow:true},
 {name:'Nutty O',genre:'Afro-Pop',year:2012,status:['Charting','Recently Active'],chart:92,follow:true},
 {name:'Alexio Kawara',genre:'Afro-Jazz',year:1998,status:['Recently Active'],chart:75,follow:false},
 {name:'Enzo Ishall',genre:'Zimdancehall',year:2017,status:['Charting'],chart:87,follow:false},
 {name:'Mokoomba',genre:'Afro-Jazz',year:2001,status:['Recently Active'],chart:73,follow:false},
 {name:'Takura',genre:'R&B',year:2012,status:['Charting','Recently Active'],chart:90,follow:true},
 {name:'Gemma Griffiths',genre:'Amapiano',year:2017,status:['Recently Active'],chart:78,follow:false},
 {name:'Minister Mahendere',genre:'Gospel',year:2010,status:['Charting'],chart:80,follow:false},
 {name:'Judgement Yard',genre:'House',year:2014,status:['Recently Active'],chart:74,follow:false}
];
const letters=['ALL',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
const az=document.getElementById('az');
az.innerHTML=letters.map((l,i)=>`<button class="${i===0?'active':''}" data-letter="${l}">${l}</button>`).join('');
let selectedLetter='ALL';
function getQueryGenre(){const p=new URLSearchParams(location.search).get('genre');if(!p)return;const sel=document.getElementById('genre');for(const o of sel.options) if(o.value.toLowerCase()===p.toLowerCase()) sel.value=o.value;}
function isFollowing(a){return JSON.parse(localStorage.getItem('trackhype_following_artists')||'[]').includes(a.name)}
function toggleFollow(name,button){let arr=JSON.parse(localStorage.getItem('trackhype_following_artists')||'[]');if(arr.includes(name)){arr=arr.filter(x=>x!==name);button.classList.remove('active');button.textContent='Follow'}else{arr.push(name);button.classList.add('active');button.textContent='Following'}localStorage.setItem('trackhype_following_artists',JSON.stringify(arr));render()}
function render(){
 const genre=document.getElementById('genre').value,status=document.getElementById('status').value,year=document.getElementById('year').value,sort=document.getElementById('sort').value;
 let data=artists.filter(a=>genre==='All Genres'||a.genre===genre).filter(a=>status==='All Status'||a.status.includes(status)).filter(a=>year==='Any Year'||String(a.year)===year).filter(a=>selectedLetter==='ALL'||a.name.toUpperCase().startsWith(selectedLetter));
 if(sort==='active')data.sort((a,b)=>Math.max(...b.status.map(s=>s==='Recently Active'?2:1))-Math.max(...a.status.map(s=>s==='Recently Active'?2:1))); 
 if(sort==='charting')data.sort((a,b)=>b.chart-a.chart);
 if(sort==='following')data.sort((a,b)=>Number(isFollowing(b))-Number(isFollowing(a)));
 if(sort==='alphabetical')data.sort((a,b)=>a.name.localeCompare(b.name));
 document.getElementById('resultCount').textContent=`${data.length} artist${data.length===1?'':'s'}`;
 document.getElementById('artistList').innerHTML=data.map(a=>{const initials=a.name.split(' ').map(x=>x[0]).slice(0,2).join('');const following=isFollowing(a);return `<div class="row artist-row" onclick="location.href='artist.html?artist=${encodeURIComponent(a.name)}'"><div class="artist-avatar">${initials}</div><div class="meta"><div class="title">${a.name}</div><div class="sub">${a.genre} · Active since ${a.year}</div><div class="artist-stats"><span>#${Math.max(1,Math.round((100-a.chart)/4))} peak</span>${a.status.map(s=>`<span>${s}</span>`).join('')}</div></div><button class="follow-btn ${following?'active':''}" onclick="event.stopPropagation();toggleFollow('${a.name.replace(/'/g,"\\'")}',this)">${following?'Following':'Follow'}</button><button class="icon-btn" onclick="event.stopPropagation();nav('artist.html?artist=${encodeURIComponent(a.name)}')">›</button></div>`}).join('')||'<div class="card"><div class="title">No artists match these filters.</div><div class="sub">Try another genre, year or status.</div></div>';
}
az.querySelectorAll('button').forEach(b=>b.onclick=()=>{az.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedLetter=b.dataset.letter;render()});
['genre','status','year','sort'].forEach(id=>document.getElementById(id).addEventListener('change',render));
getQueryGenre();render();initShell('artists.html');
</script>
</body>
</html>
