<!doctype html>
<html lang="en-ZW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TrackHype">
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
  </script>
  <link rel="icon" type="image/webp" href="Assets/logos/TrackHype Logo Design Badge.webp">
  <title>Settings — TrackHype</title>
  <link rel="stylesheet" href="trackhype.css">
  <style>
    .pg-kicker{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--th-primary-dark);text-align:center}
    .pg-title{font-size:24px;font-weight:900;color:var(--th-text);margin-top:4px;text-align:center}
    .pg-sub{font-size:13px;color:var(--th-muted);margin-top:6px;line-height:1.6;text-align:center}
    .menu-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--th-border-soft);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
    .menu-row:last-child{border-bottom:0}
    .menu-row.centered{justify-content:center;text-align:center}
  </style>
</head>
<body data-active-nav="menu.html">

  <header class="th-header" data-app-header>
    <div class="th-header-inner">
      <a class="th-brand" href="index.html">
        <img class="th-logo-badge" src="Assets/logos/TrackHype Logo Design Badge.webp" alt="TrackHype">
        <img class="th-logo-text" src="Assets/logos/track-hype-text-logo.webp" alt="TrackHype">
      </a>
    </div>
  </header>

  <main class="th-app">
    <div class="th-shell">

      <section id="hub-intro">
        <div class="pg-kicker">Settings</div>
        <h1 class="pg-title">Settings</h1>
        <p class="pg-sub">Data usage, preferences and your account.</p>
      </section>

      <section id="help-and-policies">
        <div class="th-card">
          <button class="menu-row centered" type="button" onclick="TrackHype.navigate('voting-rules.html')"><span style="font-weight:800">Voting &amp; Chart Rules</span></button>
          <button class="menu-row centered" type="button" onclick="TrackHype.navigate('faqs.html')"><span style="font-weight:800">FAQs</span></button>
          <button class="menu-row centered" type="button" onclick="TrackHype.navigate('privacy-policy.html')"><span style="font-weight:800">Privacy Policy</span></button>
          <button class="menu-row centered" type="button" onclick="TrackHype.navigate('terms-of-use.html')"><span style="font-weight:800">Terms of Use</span></button>
          <button class="menu-row centered" type="button" onclick="TrackHype.navigate('support.html')"><span style="font-weight:800">Support</span></button>
        </div>
      </section>

    </div>
  </main>

  <div class="bottom-swipe" data-bottom-swipe>
    <nav class="bottom-nav" data-bottom>
      <div class="bottom-nav-inner" data-nav-host></div>
    </nav>

    <aside class="promo-player" data-player></aside>
  </div>

  <div class="th-modal-backdrop" data-modal>
    <div class="th-sheet" role="dialog" aria-modal="true">
      <div class="th-sheet-handle"></div>
      <h3 data-modal-title></h3>
      <div data-modal-body></div>
      <div class="th-sheet-actions" data-modal-actions></div>
    </div>
  </div>

  <script src="demo-playlist.js"></script>
  <script src="trackhype.js"></script>
</body>
</html>
