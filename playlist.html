<!doctype html>
<html lang="en-ZW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/webp" href="Assets/logos/TrackHype Logo Design Badge.webp">
  <title>Promo-Playlist — TrackHype</title>
  <link rel="stylesheet" href="trackhype.css">
  <style>
    .pl-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid var(--th-border-soft)}
    .pl-row:last-child{border-bottom:0}
    .pl-thumb{flex:none;width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--th-grey-2)}
    .pl-fav{width:32px;height:32px;flex:none}
    .pl-meta{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
    .pl-actions{display:flex;align-items:center;gap:6px;flex:none}
    .pl-actions .th-icon-btn.is-active{background:var(--th-primary);color:#fff}

    .r-rail{display:flex;gap:12px;overflow-x:auto;padding:12px 14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
    .r-card{flex:0 0 116px;scroll-snap-align:start;text-align:center;cursor:pointer;border:2px solid transparent;border-radius:14px;padding:4px;transition:border-color .15s ease}
    .r-card img{width:116px;height:116px;border-radius:12px;object-fit:cover;display:block;background:var(--th-grey-2)}
    .r-card.is-active{border-color:var(--th-primary)}
    .r-name{font-weight:800;font-size:12.5px;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .r-tracks{font-size:11px;color:var(--th-muted);margin-top:2px}

    .genre-list{display:grid;gap:10px;max-height:52vh;overflow:auto;padding:2px}
    .genre-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--th-border);border-radius:var(--th-radius-sm);background:var(--th-grey-1);font-weight:800;font-size:13px;text-align:left}
    .genre-item:active{transform:scale(.99)}
    .genre-mark{color:var(--th-primary)}
  </style>
</head>
<body data-active-nav="menu.html">

  <header class="th-header" data-app-header>
    <div class="th-header-inner">
      <button class="th-icon-btn" type="button" aria-label="Back" onclick="history.back()">‹</button>
      <a class="th-brand" href="index.html">
        <img class="th-logo-badge" src="Assets/logos/TrackHype Logo Design Badge.webp" alt="TrackHype">
        <img class="th-logo-text" src="Assets/logos/track-hype-text-logo.webp" alt="TrackHype">
      </a>
      <div class="th-header-context">Promo-Playlist</div>
    </div>
  </header>

  <main class="th-app">
    <div class="th-shell">

      <section>
        <h1 class="th-page-title">Promo-Playlists</h1>
        <p class="th-page-subtitle">Browse promo playlists by genre. Slide the rail left and right or use the Genre button to load a playlist.</p>
      </section>

      <section>
        <button class="th-btn primary block" type="button" onclick="openGenrePicker()">
          ♫ Genre · <span id="promoGenreLabel">Zim Hip Hop</span> ⌄
        </button>
      </section>

      <section>
        <div class="th-card" id="fullPlaylist" style="padding:0">
          <div class="r-rail" id="promoRail"></div>
        </div>
      </section>

      <section>
        <div class="th-card" id="genreSongs"></div>
        <div class="th-empty" id="emptyPlaylist" hidden>
          <strong>No tracks for this genre yet.</strong>
          Choose another promo playlist from the rail or the Genre button.
        </div>
      </section>

    </div>
  </main>

  <nav class="th-bottom" data-bottom>
    <div class="th-bottom-inner" data-nav-host></div>
  </nav>

  <aside class="promo-player" data-player></aside>

  <div class="th-modal-backdrop" data-modal>
    <div class="th-sheet" role="dialog" aria-modal="true">
      <div class="th-sheet-handle"></div>
      <h3 data-modal-title></h3>
      <div data-modal-body></div>
      <div class="th-sheet-actions" data-modal-actions></div>
    </div>
  </div>

  <script src="trackhype.js"></script>
  <script>
    const GENRES = (TrackHype.CATALOG.genres || []).map(g => g.title);
    const ARTIST_POOL = ["Winky D","Holy Ten","Feli Nandi","Alick Macheso"];

    function genreTracks(genre){
      const found = TrackHype.CATALOG.songs
        .filter(s => s.genre === genre)
        .map(s => ({ id: s.id, title: s.title, artist: s.artist, artwork: s.artwork, genre }));
      if(found.length){
        return found;
      }
      return Array.from({length:8},(_,i)=>({
        id: "promo-" + genre + "-" + i,
        title: genre + " Promo Track " + (i + 1),
        artist: ARTIST_POOL[i % ARTIST_POOL.length],
        artwork: TrackHype.getArtwork(i),
        genre
      }));
    }

    let activeGenre = GENRES.includes("Zim Hip Hop") ? "Zim Hip Hop" : (GENRES[0] || "Zim Hip Hop");
    let tracks = genreTracks(activeGenre);

    function isFav(id){
      try{
        return JSON.parse(localStorage.getItem("trackhype:promo-songs") || "[]").includes(id);
      }catch(error){
        return false;
      }
    }

    function renderRail(){
      document.getElementById("promoRail").innerHTML = GENRES.map(g => {
        const list = genreTracks(g);
        const art = list[0] ? list[0].artwork : TrackHype.getArtwork(0);
        const active = g === activeGenre;
        return `
        <div class="r-card${active ? " is-active" : ""}" onclick="selectGenre('${g}')">
          <img src="${TrackHype.esc(art)}" alt="" onerror="this.style.visibility='hidden'">
          <div class="r-name">${TrackHype.esc(g)}</div>
          <div class="r-tracks">${list.length} ${list.length === 1 ? "track" : "tracks"}</div>
        </div>`;
      }).join("");
    }

    function renderSongs(){
      document.getElementById("genreSongs").innerHTML = tracks.map((s,i) => `
        <div class="pl-row">
          <img class="pl-thumb" src="${TrackHype.esc(s.artwork)}" onerror="this.style.visibility='hidden'">
          <div class="pl-meta">
            <div style="min-width:0">
              <div style="font-weight:800;font-size:13px">${TrackHype.esc(s.artist)}</div>
              <div style="font-size:12px;color:var(--th-muted)">${TrackHype.esc(s.title)}</div>
            </div>
          </div>
          <div class="pl-actions">
            <a class="th-mini-btn pl-fav" style="text-decoration:none" title="Favourite" onclick="toggleFavItem(${i})">
              <img id="fav-${i}" src="Assets/icons/heart_active_icon.png" alt="" style="opacity:${isFav(s.id) ? 1 : .45}">
            </a>
            <button class="th-icon-btn" type="button" onclick="toggleRepeat(this,${i})" aria-label="Repeat" title="Repeat">↻</button>
            <button class="th-icon-btn" type="button" onclick="playTrack(${i})" aria-label="Play">▶</button>
          </div>
        </div>`).join("") || "";
      document.getElementById("emptyPlaylist").hidden = tracks.length !== 0;
    }

    window.toggleFavItem = (i) => {
      const s = tracks[i];
      if(!s) return;
      const on = fav("promo-songs", s.id);
      const img = document.getElementById("fav-" + i);
      if(img){ img.style.opacity = on ? 1 : .45; }
      TrackHype.toast(on ? "Added to favourites" : "Removed from favourites");
    };

    window.playTrack = (i) => {
      const s = tracks[i];
      if(!s) return;
      TrackHype.updateState(st => {
        st.currentTrack = { id: s.id, title: s.title, artist: s.artist, artwork: s.artwork, genre: s.genre };
        st.isPlaying = true;
        st.progress = 0;
      });
      TrackHype.toast("Playing " + s.title);
    };

    window.toggleRepeat = (btn, i) => {
      const key = "repeat-" + tracks[i].id;
      let active;
      TrackHype.updateState(st => {
        st.repeatKeys = st.repeatKeys || [];
        active = !st.repeatKeys.includes(key);
        if(active){ st.repeatKeys.push(key); }
        else { st.repeatKeys = st.repeatKeys.filter(k => k !== key); }
      });
      btn.classList.toggle("is-active", active);
      TrackHype.toast(active ? "Repeat on" : "Repeat off");
    };

    window.selectGenre = (genre) => {
      activeGenre = genre;
      tracks = genreTracks(genre);
      document.getElementById("promoGenreLabel").textContent = genre;
      renderRail();
      renderSongs();
      TrackHype.closeSheet();
      TrackHype.toast("Loaded " + genre + " promo playlist");
    };

    window.openGenrePicker = () => {
      TrackHype.openSheet({
        title: "Choose a genre",
        html: `<div class="genre-list">${GENRES.map(g => `
          <button class="genre-item" type="button" onclick="selectGenre('${g}')">
            <span>${TrackHype.esc(g)}</span>
            ${g === activeGenre ? '<span class="genre-mark">✔</span>' : ""}
          </button>`).join("")}</div>`
      });
    };

    document.getElementById("promoGenreLabel").textContent = activeGenre;
    renderRail();
    renderSongs();
  </script>

</body>
</html>
