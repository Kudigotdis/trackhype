<!doctype html>
<html lang="en-ZW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/webp" href="Assets/logos/TrackHype Logo Design Badge.webp">
  <title>Hyped — TrackHype</title>
  <link rel="stylesheet" href="trackhype.css">
  <style>
    .hy-meter{font-size:11px;font-weight:800;color:var(--th-muted)}
    .hy-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 1px 8px;-webkit-overflow-scrolling:touch}
    .hy-strip::-webkit-scrollbar{display:none}
    .hy-tile{flex:none;width:132px;cursor:pointer;text-decoration:none}
    .hy-tile-art{width:132px;height:132px;border-radius:var(--th-radius-sm);object-fit:cover;background:#fff}
    .hy-tile-rank{position:relative;width:132px;height:132px;border-radius:var(--th-radius-sm);background:var(--th-grey-3);display:grid;place-items:center;font-size:22px;font-weight:900;color:var(--th-primary-dark)}
    .hy-view-link{font-size:12px;font-weight:900;color:var(--th-muted)}

    #radioShows{display:flex;flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x mandatory;gap:5px;scrollbar-width:none;-ms-overflow-style:none}
    #radioShows::-webkit-scrollbar{display:none}
    #radioShows a.hy-tile{flex:0 0 calc((100% - 10px)/3);aspect-ratio:1/1;scroll-snap-align:start}
    #radioShows img.hy-tile-art.radio-logo{width:100%;height:100%;object-fit:cover;border-radius:4px;padding:0;background:#fff;border:1px solid rgba(0,0,0,.1);box-sizing:border-box}
    #radioShows .radio-logo-fallback{width:100%;height:100%;border-radius:4px}

    #acc-radio{
      width:100vw;
      margin:-18px calc(50% - 50vw) 0;
      padding:18px 0 0;
      gap:0;
      background:color-mix(in srgb,var(--th-muted) 15%,transparent);
    }
    #acc-radio > .acc-head,
    #acc-radio > .acc-body{max-width:760px;margin-left:auto;margin-right:auto;padding-left:16px;padding-right:16px}
    #acc-radio > .acc-head{margin-bottom:12px}
    #acc-radio .acc-advert{margin:0}
    #acc-radio .hy-strip{padding:2px 1px 6px}
    #acc-recent,#acc-national{margin-bottom:-20px}

    .th-advert{border:0;background:none;min-height:0;padding:0}
    .th-advert img{display:block;width:100%;height:auto}

    .filter-row{position:relative;display:flex;align-items:center;height:42px;margin:-20px -16px 4px;border-radius:0;background:var(--th-grey-3);background:color-mix(in srgb,var(--th-muted) 15%,transparent);overflow:hidden;-webkit-user-select:none;user-select:none}
    .filter-row::before{content:"";position:absolute;top:0;bottom:0;left:0;width:50%;background:var(--th-primary);transition:transform .25s ease}
    .filter-row[data-active="spiritual"]::before{transform:translateX(100%)}
    .filter-btn{position:relative;flex:1;height:100%;border:0;background:none;font-size:13px;font-weight:800;text-align:center;color:var(--th-muted);transition:color .2s ease}
    .filter-btn.is-active{color:#003a25}

    .Hyped-Featured-Genre-Preview{display:flex;flex-direction:column;gap:12px;margin-top:14px}
    .genre-hero{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--th-radius);cursor:pointer;border:1px solid var(--th-border-soft);background:var(--th-grey-2)}
    .genre-charting-strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 1px 8px;-webkit-overflow-scrolling:touch}
    .genre-charting-strip::-webkit-scrollbar{display:none}
    .genre-page{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:2px 1px}
    .genre-scroll-cell{display:block;aspect-ratio:1;border-radius:var(--th-radius-sm);overflow:hidden;border:1px solid var(--th-border-soft);background:var(--th-grey-2)}
    .genre-scroll-cell img{width:100%;height:100%;object-fit:cover;display:block}

    .Recent-Charts-Section{display:flex;flex-direction:column;gap:12px}
    .rc-scroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
    .rc-scroll::-webkit-scrollbar{display:none}
    .rc-page{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:2px 1px}
    .rc-page a{display:block;aspect-ratio:1;border-radius:var(--th-radius-sm);overflow:hidden;background:var(--th-grey-2);border:1px solid var(--th-border-soft)}
    .rc-page img{width:100%;height:100%;object-fit:cover;display:block}

    .acc-head{width:100%;display:flex;align-items:center;background:none;border:0;padding:0;text-align:left;cursor:pointer;-webkit-user-select:none;user-select:none}
    .acc-head .th-section-head{width:100%}
    .acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease;overflow:hidden}
    .acc-body-inner{min-height:0;overflow:hidden}
    .acc.open .acc-body{grid-template-rows:1fr}
    .acc-advert{margin-top:14px}

    .th-flag-btn{margin-left:auto}
  </style>
</head>

    function chartArt(g){
      let base = g;
      if(base.indexOf("Gospel ") === 0){ base = base.slice(7); }
      const h = GENRE_ONE[base];
      if(h && h.art){ return h.art; }
      if(base === "Zim Hip Hop") return "Assets/charts/top_25_local_hip_hop/1.jpg";
      if(base === "House" || base === "Zimbabwean House") return "Assets/charts/top_20_house/1.jpg";
      if(base === "R&B") return "Assets/charts/top_20_rnb_chart/1.jpg";
      return "Assets/charts/top_40_chart/1.jpg";
    }

    function art(index){ return "Assets/charts/top_40_chart/" + ((index % 40) + 1) + ".jpg"; }

    function currentRegionCountry(){
      try{
        const r = JSON.parse(localStorage.getItem("trackhype.region") || "null");
        if(r && r.name && /botswana/i.test(r.name)) return "Botswana";
      }catch(e){}
      return "Zimbabwe";
    }
    (function(){
      const country = currentRegionCountry();
      const stations = (window.RADIO_STATIONS || []).filter(s => s.country === country);

      activeFilter = filter;
      document.getElementById("filterRow").dataset.active = filter;
      document.querySelectorAll(".filter-btn").forEach(b => {
        b.classList.toggle("is-active", b.dataset.filter === filter);
      });
      renderAllContent();
    }

    function renderAllContent(){
      const genres = activeFilter === "culture" ? cultureGenres : spiritualGenres;
      const prefs = (typeof TrackHype.getHomeCharts === "function")
        ? TrackHype.getHomeCharts()
        : { order: cultureGenres.slice(), enabled: {} };
      const sectionBase = prefs.order.filter(g => prefs.enabled[g] !== false);
      const sectionGenres = activeFilter === "culture"
        ? sectionBase
        : sectionBase.map(g => "Gospel " + g);

      function pages(items){
        const out = [];
        for(let i = 0; i < items.length; i += 10){ out.push(items.slice(i, i + 10)); }
        return out;
      }

      document.getElementById("recentCharts").innerHTML = pages(genres).map(chunk =>
        '<div class="rc-page">' + chunk.map(g =>
          `<a href="charts.html?chart=${encodeURIComponent(g)}"><img loading="lazy" src="${chartArt(g)}" alt=""></a>`
        ).join("") + '</div>'
      ).join("");

      const nation = (typeof TrackHype.buildChartDataset === "function")
        ? TrackHype.buildChartDataset("National Top 100 Chart").slice(0,10)
        : null;
      const nationSongs = (nation && nation.length ? nation : Array.from({length:10},(_,i)=>({id:i+1, title:"#"+(i+1), artist:"National Top 100"})));
      document.getElementById("nationalTop").innerHTML = pages(nationSongs).map(chunk =>
        '<div class="rc-page">' + chunk.map((s,i) =>
          `<a href="song.html?id=${TrackHype.esc(s.id)}"><img loading="lazy" src="${art(i)}" alt=""></a>`
        ).join("") + '</div>'
      ).join("");

      function heroFor(g){
        if(g.indexOf("Gospel ") === 0){ g = g.slice(7); }
        return GENRE_ONE[g];
      }

      function randChartArt(){
        return CHART_ART[Math.floor(Math.random() * CHART_ART.length)];
      }

      function randDemoSong(){
        const s = DEMO_SONGS[Math.floor(Math.random() * DEMO_SONGS.length)];
        return { title: s.title, artist: s.artist, art: randChartArt() };
      }

      document.getElementById("genreSections").innerHTML = sectionGenres.map((g,i) => {
        const hero = heroFor(g);
        const heroArt = (hero && hero.art) ? hero.art : randChartArt();
        const heroHref = hero ? "song.html?title=" + encodeURIComponent(hero.title) + "&artist=" + encodeURIComponent(hero.artist) + "&genre=" + encodeURIComponent(hero.genre) + "&art=" + encodeURIComponent(heroArt) : randDemoSong();
        const stripSongs = Array.from({length:9}, randDemoSong);
        return `
          ${i > 0 ? `<div class="th-advert th-advert--full"><img src="Assets/Demo Media/DemoMedia - Paid Promo.webp" alt="DemoMedia - Paid Promo"></div>` : ""}
          <section class="Hyped-Featured-Genre-Preview">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
              <span style="font-size:17px;font-weight:900">${g}</span>
              <span style="display:flex;gap:10px">
                <a class="hy-view-link" href="charts.html?chart=${encodeURIComponent(g)}">Chart</a>
                <span class="hy-dot-separator">·</span>
                <a class="hy-view-link" href="artists.html?genre=${encodeURIComponent(g)}">Artists</a>
              </span>
            </div>
            ${hero ? `<a href="${heroHref}"><img class="genre-hero" loading="lazy" src="${heroArt}" alt="${hero.title}"></a>` : ""}
            <div class="genre-charting-strip">${(function(){
              const pages=[];
              for(let k=0;k<stripSongs.length;k+=3){ pages.push(stripSongs.slice(k,k+3)); }
              return pages.map(page =>
                `<div class="genre-page">` + page.map(sg => {
                  const href = "song.html?title=" + encodeURIComponent(sg.title) + "&artist=" + encodeURIComponent(sg.artist) + "&art=" + encodeURIComponent(sg.art);
                  return `<a class="genre-scroll-cell" href="${href}"><img loading="lazy" src="${sg.art}" alt="${sg.title}"></a>`;
                }).join("") + `</div>`
              ).join("");
            })()}</div>
          </section>`;
      }).join("");
    }

    window.toggleAcc = (id) => {
      const el = document.getElementById(id);
      if(!el){ return; }
      const open = el.classList.toggle("open");
      const head = el.querySelector(".acc-head");
      if(head){ head.setAttribute("aria-expanded", open ? "true" : "false"); }
    };

    renderAllContent();

    // Hydrate signed-in name from Supabase when a session exists.
    (async () => {
      try{
        if(!window.API || !window.API.ready()){ return; }
        const user = await API.currentUser();
        if(!user){ return; }
        let name = localStorage.getItem("trackhype_user_name") || "";
        if(!name.trim()){
          const p = await API.getProfile();
          if(p && p.data){
            name = ((p.data.first_name || "") + " " + (p.data.surname || "")).trim() || p.data.username || user.email || "TrackHype User";
            try{ localStorage.setItem("trackhype_onboarding_complete", "true"); }catch(e){}
          }else{
            name = user.email || "TrackHype User";
          }
          try{ localStorage.setItem("trackhype_user_name", name.trim()); }catch(e){}
        }
      }catch(e){}
    })();
  </script>
</body>
</html>
