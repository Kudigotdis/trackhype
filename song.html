<!doctype html>
<html lang="en-ZW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/webp" href="Assets/logos/TrackHype Logo Design Badge.webp">
  <title>Song — TrackHype</title>
  <link rel="stylesheet" href="trackhype.css">
  <style>
    .song-page-view{min-height:100vh}
    .Song-Title{display:flex;gap:16px;align-items:center}
    .sg-art{flex:none;width:104px;height:104px;border-radius:var(--th-radius-sm);object-fit:cover;background:var(--th-grey-2);border:1px solid var(--th-border-soft)}
    .sg-title{font-size:22px;font-weight:900;line-height:1.2;color:var(--th-text)}
    .YouTube-Section{width:100%}
    .sg-youtube{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;display:block;background:#000}
    .Music-Icons{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:nowrap}
    .sg-link{display:inline-flex;align-items:center;justify-content:center;line-height:0}
    .sg-link:active{transform:scale(.94)}
    .sg-link img{width:36px;height:36px;object-fit:contain}
    #favIcon{width:31px;height:31px;object-fit:contain}
    .Share-Icons{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:nowrap}
    .sg-chart-label{font-size:13px;font-weight:800;color:var(--th-text)}
    .th-table-row .sg-chart-sub{display:block;font-size:12px;color:var(--th-muted)}
    .th-table-row .sg-rank{font-size:16px;font-weight:900;color:var(--th-text)}
    #chartPositions .th-table-row,
    #chartHistory .th-table-row{border-radius:0}
    .sg-artist-row{display:flex;align-items:center;gap:12px;padding:12px}
    .sg-artist-row + .sg-artist-row{border-top:1px solid var(--th-border-soft)}
    .sg-artist-avatar{flex:none;width:44px;height:44px;border-radius:3px;object-fit:cover;background:var(--th-grey-2)}
    .sg-artist-name{font-size:14px;font-weight:800;color:var(--th-text);line-height:1.3}
    .lyr-panel{padding:16px;max-height:320px;overflow:auto;line-height:1.8;white-space:pre-line;font-size:13px;color:var(--th-text)}
    .sg-accordion{display:flex;flex-direction:column;gap:10px}
    .sg-accordion summary{list-style:none;cursor:pointer;text-align:center;font-size:17px;font-weight:900;color:var(--th-text);padding:12px;background:rgba(15,25,40,.10);border-radius:3px;-webkit-user-select:none;user-select:none}
    .sg-accordion summary::-webkit-details-marker{display:none}
    #chartHistorySection{margin-top:-20px}
    #lyricsSection{margin-top:-20px}
    .song-page-view .th-card.Song-Title{
      margin:0;
      border:0;
      border-radius:0;
      box-shadow:none;
    }
    .sg-back{
      background:#01925f;
      width:315.2px;
      max-width:100%;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:13px;
    }
    @media(min-width:520px){
      .Share-Icons{gap:24px}
    }
    @media(max-width:380px){
      .sg-art{width:88px;height:88px}
      .sg-title{font-size:19px}
      .Music-Icons{gap:16px}
      .Share-Icons{gap:16px}
    }
  </style>
</head>
<body data-active-nav="search.html">

<header class="th-header" data-app-header>
    <div class="th-header-inner">
      <a class="th-brand" href="index.html">
        <img class="th-logo-badge" src="Assets/logos/TrackHype Logo Design Badge.webp" alt="TrackHype">
        <img class="th-logo-text" src="Assets/logos/track-hype-text-logo.webp" alt="TrackHype">
      </a>
    </div>
  </header>

  <main class="song-page-view">
    <div class="th-shell">

<section>
        <div class="th-card Song-Title">
          <img class="sg-art" id="songArt" src="Assets/charts/top_40_chart/1.jpg" onerror="this.style.visibility='hidden'">
          <div style="flex:1;min-width:0">
            <div class="sg-title" id="songTitle">TrackHype Song</div>
          </div>
        </div>
      </section>

      <section class="th-section">
        <div class="th-card" id="artistList"></div>
      </section>

<section class="th-section">
        <div class="YouTube-Section">
          <div id="youtubeBox">
            <video id="youtubeVideo" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px" src="Assets/video/Victony - SLICK (Official Visualizer) - Victony (360p, h264, youtube).mp4" controls playsinline preload="metadata"></video>
          </div>
        </div>
      </section>

<section class="th-section">
        <div class="Music-Icons">
          <a id="favBtn" style="text-decoration:none;line-height:0" title="Favourite" onclick="toggleFav()">
            <img id="favIcon" src="Assets/icons/heart_inactive_icon.png" alt="">
          </a>
          <a class="sg-link" href="#" target="_blank" rel="noopener" aria-label="Listen on Spotify"><img src="Assets/icons/Spotify_icon.svg.webp" alt=""></a>
          <a class="sg-link" href="#" target="_blank" rel="noopener" aria-label="Listen on YouTube"><img src="Assets/icons/YouTube_On.png" alt=""></a>
          <a class="sg-link" href="#" target="_blank" rel="noopener" aria-label="Listen on Amazon Music"><img src="Assets/icons/amazon_music_icon.webp" alt=""></a>
          <a class="sg-link" href="#" target="_blank" rel="noopener" aria-label="Listen on iTunes"><img src="Assets/icons/itunes_icon.png" alt=""></a>
        </div>
      </section>

      <section class="th-section">
        <details class="sg-accordion">
          <summary>Current Chart Positions</summary>
          <div class="th-card" id="chartPositions"></div>
        </details>
      </section>

<section class="th-section" id="chartHistorySection">
        <details class="sg-accordion">
          <summary>Chart History</summary>
          <div class="th-card" id="chartHistory"></div>
        </details>
      </section>

<section class="th-section" id="lyricsSection">
        <details class="sg-accordion">
          <summary>Lyrics</summary>
          <div class="th-card lyr-panel" id="lyrics">Loading lyrics…</div>
        </details>
      </section>

      <section class="th-section">
        <div class="Share-Icons">
          <a class="sg-link" href="#" target="_blank" rel="noopener" aria-label="Share on Facebook" onclick="shareFacebook();return false;"><img src="Assets/icons/facebook_icon_on.png" alt=""></a>
          <a class="sg-link" href="#" target="_blank" rel="noopener" aria-label="Share on WhatsApp" onclick="shareWhatsApp();return false;"><img src="Assets/icons/whatsApp_icon_on.png" alt=""></a>
          <a class="sg-link" href="#" target="_blank" rel="noopener" aria-label="Tweet this song" onclick="shareTwitter();return false;"><img src="Assets/icons/Twitter_On.png" alt=""></a>
          <a class="sg-link" href="#" target="_blank" rel="noopener" aria-label="Share on TikTok"><img src="Assets/icons/TikTok_On.png" alt=""></a>
        </div>
      </section>

      <button class="th-btn primary sg-back" type="button" onclick="history.back()">Back</button>

    </div>
  </main>

  <div class="bottom-swipe" data-bottom-swipe>
    <nav class="bottom-nav" data-bottom>
      <div class="bottom-nav-inner" data-nav-host></div>
    </nav>

    <aside class="promo-player" data-player></aside>
  </div>

  <div class="th-modal-backdrop" data-modal>
    <div class="th-sheet" role="dialog" aria-modal="true">
      <div class="th-sheet-handle"></div>
      <h3 data-modal-title></h3>
      <div data-modal-body></div>
      <div class="th-sheet-actions" data-modal-actions></div>
    </div>
  </div>

  <script src="demo-playlist.js"></script>
  <script src="trackhype.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id") || "1";
    const chart = params.get("chart") || "top40";
    const currentId = String(id);

const SONG_DATA = {
      title: params.get("title") || ("Zimbabwe Sample Song " + id),
      artist: params.get("artist") || ("Zimbabwe Artist " + id),
      featured: params.get("feat") || "Featured Artist " + id,
      genre: params.get("genre") || "Zim Hip Hop",
      city: "Harare",
      artwork: params.get("art") || "Assets/charts/top_40_chart/" + (Number(id) % 40 || 1) + ".jpg"
    };

    document.getElementById("songArt").src = SONG_DATA.artwork;
    document.getElementById("songTitle").textContent = SONG_DATA.title;

    document.getElementById("artistList").innerHTML = `
      <div class="sg-artist-row">
        <img class="sg-artist-avatar" src="Assets/charts/top_40_chart/${Number(id) % 40 || 1}.jpg" onerror="this.style.visibility='hidden'">
        <div style="flex:1;min-width:0"><div class="sg-artist-name">${TrackHype.esc(SONG_DATA.artist)}</div></div>
      </div>
      <div class="sg-artist-row">
        <img class="sg-artist-avatar" src="Assets/charts/top_40_chart/${(Number(id) + 1) % 40 || 1}.jpg" onerror="this.style.visibility='hidden'">
        <div style="flex:1;min-width:0"><div class="sg-artist-name">${TrackHype.esc(SONG_DATA.featured)}</div></div>
      </div>`;

function updateFavIcon(){
      const active = TrackHype.getState().favouriteSongs.includes(currentId);
      document.getElementById("favIcon").src = active ? "Assets/icons/heart_active_icon.png" : "Assets/icons/heart_inactive_icon.png";
    }

    const CHART_POSITIONS = [
      { chart: "National Top 100", rank: 7 },
      { chart: "Zim Hip Hop Top 20", rank: 3 }
    ];

    document.getElementById("lyrics").textContent = TrackHype.SONG_LYRICS || "No lyrics available.";

    const CHART_HISTORY = [
      { period: "Week 34 · Aug 2026", rank: 7, points: 14 },
      { period: "Week 33 · Aug 2026", rank: 12, points: 9 },
      { period: "Week 32 · Aug 2026", rank: 15, points: 6 },
      { period: "Week 31 · Aug 2026", rank: 19, points: 2 }
    ];

    document.getElementById("chartPositions").innerHTML = CHART_POSITIONS.length
      ? CHART_POSITIONS.map(p => `
        <div class="th-table-row" style="grid-template-columns:1fr auto;padding:14px 14px">
          <div><strong class="sg-chart-label">${TrackHype.esc(p.chart)}</strong><span class="sg-chart-sub">Current chart period</span></div>
          <span class="sg-rank">#${p.rank}</span>
        </div>`).join("")
      : '<div class="th-empty"><strong>Not currently charting.</strong>This song is not on any official chart yet.</div>';

    document.getElementById("chartHistory").innerHTML = CHART_HISTORY.length
      ? CHART_HISTORY.map(h => `
        <div class="th-table-row" style="grid-template-columns:1fr auto;padding:14px 14px">
          <div><strong class="sg-chart-label">${TrackHype.esc(h.period)}</strong><span class="sg-chart-sub">National Top 100</span></div>
          <span class="sg-rank">#${h.rank}</span>
        </div>`).join("")
      : '<div class="th-empty"><strong>No chart history yet.</strong>Past placements will appear here.</div>';

    window.toggleFav = () => {
      TrackHype.updateState(s => {
        s.favouriteSongs = s.favouriteSongs || [];
        const i = s.favouriteSongs.indexOf(currentId);
        if(i >= 0){ s.favouriteSongs.splice(i,1); } else { s.favouriteSongs.push(currentId); }
      });
updateFavIcon();
      TrackHype.toast("Updated favourites");
    };

    window.shareFacebook = () => {
      const url = encodeURIComponent(location.href);
      window.open("https://www.facebook.com/sharer/sharer.php?u=" + url, "_blank", "noopener");
    };

    window.shareTwitter = () => {
      const text = SONG_DATA.title + " on TrackHype — " + SONG_DATA.artist;
      window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(text), "_blank", "noopener");
    };

    window.shareWhatsApp = () => {
      const text = SONG_DATA.title + " on TrackHype — " + SONG_DATA.artist;
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
    };

    updateFavIcon();
  </script>
</body>
</html>
