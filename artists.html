<!doctype html>
<html lang="en-ZW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/webp" href="Assets/logos/TrackHype Logo Design Badge.webp">
  <title>Artists — TrackHype</title>
  <link rel="stylesheet" href="trackhype.css">
  <style>
    .az{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
    .az button{border:1px solid var(--th-border);background:var(--th-bg);border-radius:7px;min-width:29px;height:29px;font-size:11px;font-weight:900;color:var(--th-muted)}
    .az button.is-active{background:var(--th-primary);border-color:var(--th-primary);color:#fff}
    .filter-card{border:1px solid var(--th-border);border-radius:var(--th-radius);padding:14px;background:var(--th-bg)}
    .filter-label{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--th-muted);margin-bottom:8px}
    .filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .filter-row + .filter-row{margin-top:8px}
    .artist-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid var(--th-border-soft);cursor:pointer}
    .artist-row:last-child{border-bottom:0}
    .artist-avatar{flex:none;width:50px;height:50px;border-radius:50%;background:var(--th-primary);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900}
    .artist-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
    .artist-stats span{font-size:10px;font-weight:800;background:var(--th-grey-1);border-radius:999px;padding:4px 7px;color:var(--th-muted)}
    .follow-btn{flex:none;border:1px solid var(--th-border);background:var(--th-bg);border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;color:var(--th-text)}
    .follow-btn.is-following{background:var(--th-primary);border-color:var(--th-primary);color:#fff}
  </style>
</head>
<body data-active-nav="artists.html">

  <header class="th-header" data-app-header>
    <div class="th-header-inner">
      <a class="th-brand" href="index.html">
        <img class="th-logo-badge" src="Assets/logos/TrackHype Logo Design Badge.webp" alt="TrackHype">
        <img class="th-logo-text" src="Assets/logos/track-hype-text-logo.webp" alt="TrackHype">
      </a>
      <div class="th-header-context">Artists</div>
      <button class="th-icon-btn" type="button" aria-label="Search" onclick="location.href='search.html'">⌕</button>
      <button class="th-icon-btn" type="button" aria-label="Menu" onclick="location.href='menu.html'">☰</button>
    </div>
  </header>

  <main class="th-app">
    <div class="th-shell">

      <section>
        <h1 class="th-page-title">Artists</h1>
        <p class="th-page-subtitle">Explore Zimbabwean artists by genre, activity, chart performance and the artists you follow.</p>
      </section>

      <section>
        <div class="az" id="az"></div>
      </section>

      <section>
        <div class="filter-card">
          <div class="filter-label">Filters</div>
          <div class="filter-row">
            <select class="th-select" id="genre">
              <option>All Genres</option><option>Zim Hip Hop</option><option>Zimdancehall</option><option>Sungura</option><option>Gospel</option><option>Amapiano</option><option>Afro-Pop</option><option>R&B</option><option>House</option><option>Chimurenga</option><option>Afro-Jazz</option>
            </select>
            <select class="th-select" id="status">
              <option>All Status</option><option>Charting</option><option>Recently Active</option><option>Following</option>
            </select>
          </div>
          <div class="filter-row">
            <select class="th-select" id="year">
              <option>Any Year</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option>
            </select>
<select class="th-select" id="sort">
              <option value="alphabetical">A–Z</option><option value="successful">Most Successful</option><option value="active">Recently Active</option><option value="charting">Charting</option><option value="following">Following</option>
            </select>
          </div>
          <div style="font-size:11px;color:var(--th-muted);margin-top:8px">Combine genre, status and year with the sort order.</div>
        </div>
      </section>

      <section>
        <div style="font-size:12px;font-weight:800;color:var(--th-muted);margin-bottom:8px" id="resultCount"></div>
        <div class="th-card" id="artistList"></div>
      </section>

    </div>
  </main>

  <nav class="th-bottom" data-bottom>
    <div class="th-bottom-inner" data-nav-host></div>
  </nav>

  <aside class="promo-player" data-player></aside>

  <div class="th-modal-backdrop" data-modal>
    <div class="th-sheet" role="dialog" aria-modal="true">
      <div class="th-sheet-handle"></div>
      <h3 data-modal-title></h3>
      <div data-modal-body></div>
      <div class="th-sheet-actions" data-modal-actions></div>
    </div>
  </div>

  <script src="trackhype.js"></script>
  <script>
    const ARTISTS = [
      {name:'Alick Macheso',genre:'Sungura',year:1998,status:['Recently Active'],chart:91},
      {name:'Holy Ten',genre:'Zim Hip Hop',year:2019,status:['Charting','Recently Active'],chart:95},
      {name:'Feli Nandi',genre:'Afro-Pop',year:2018,status:['Charting','Recently Active'],chart:84},
      {name:'Jah Prayzah',genre:'Afro-Pop',year:2005,status:['Charting','Recently Active'],chart:98},
      {name:'T Gonzi',genre:'Zim Hip Hop',year:2010,status:['Charting'],chart:88},
      {name:'Freeman HKD Boss',genre:'Zimdancehall',year:2012,status:['Charting','Recently Active'],chart:96},
      {name:'Tocky Vibes',genre:'Zimdancehall',year:2012,status:['Recently Active'],chart:79},
      {name:'Mambo Dhuterere',genre:'Gospel',year:2018,status:['Charting','Recently Active'],chart:89},
      {name:'Saintfloew',genre:'Zim Hip Hop',year:2018,status:['Charting','Recently Active'],chart:86},
      {name:'Jah Master',genre:'Zimdancehall',year:2018,status:['Recently Active'],chart:83},
      {name:'Andy Muridzo',genre:'Afro-Pop',year:2011,status:['Charting'],chart:77},
      {name:'Janet Manyowa',genre:'Gospel',year:2010,status:['Recently Active'],chart:82},
      {name:'Nutty O',genre:'Afro-Pop',year:2012,status:['Charting','Recently Active'],chart:92},
      {name:'Alexio Kawara',genre:'Afro-Jazz',year:1998,status:['Recently Active'],chart:75},
      {name:'Enzo Ishall',genre:'Zimdancehall',year:2017,status:['Charting'],chart:87},
      {name:'Mokoomba',genre:'Afro-Jazz',year:2001,status:['Recently Active'],chart:73},
      {name:'Takura',genre:'R&B',year:2012,status:['Charting','Recently Active'],chart:90},
      {name:'Gemma Griffiths',genre:'Amapiano',year:2017,status:['Recently Active'],chart:78},
      {name:'Minister Mahendere',genre:'Gospel',year:2010,status:['Charting'],chart:80},
      {name:'Judgement Yard',genre:'House',year:2014,status:['Recently Active'],chart:74}
    ];
    const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
    let selectedLetter = 'ALL';

    function initialsOf(name){
      return name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
    }
    function isFollowing(name){
      return (TrackHype.getState().followingArtists || []).includes(name);
    }
    function toggleFollow(name, btn){
      TrackHype.updateState(s => {
        s.followingArtists = s.followingArtists || [];
        const i = s.followingArtists.indexOf(name);
        if(i >= 0){ s.followingArtists.splice(i,1); btn.classList.remove("is-following"); btn.textContent = "Follow"; }
        else { s.followingArtists.push(name); btn.classList.add("is-following"); btn.textContent = "Following"; }
      });
      render();
    }

    function renderAZ(){
      document.getElementById("az").innerHTML = letters.map(l =>
        `<button type="button" class="${l === selectedLetter ? "is-active" : ""}" data-letter="${l}">${l}</button>`
      ).join("");
      document.getElementById("az").onclick = (e) => {
        const b = e.target.closest("[data-letter]");
        if(!b) return;
        selectedLetter = b.dataset.letter;
        document.querySelectorAll("#az button").forEach(x=>x.classList.remove("is-active"));
        b.classList.add("is-active");
        render();
      };
    }

    function render(){
      const genre = document.getElementById("genre").value;
      const status = document.getElementById("status").value;
      const year = document.getElementById("year").value;
      const sort = document.getElementById("sort").value;

      let data = ARTISTS.filter(a =>
        (genre === "All Genres" || a.genre === genre) &&
        (status === "All Status" || a.status.includes(status)) &&
        (year === "Any Year" || String(a.year) === year) &&
        (selectedLetter === "ALL" || a.name.toUpperCase().startsWith(selectedLetter))
      );

if(sort === "successful") data = [...data].sort((a,b)=>(b.chart - a.chart) || a.name.localeCompare(b.name));
      if(sort === "active") data = [...data].sort((a,b)=>Math.max(...b.status.map(s=>s==="Recently Active"?2:1)) - Math.max(...a.status.map(s=>s==="Recently Active"?2:1)));
      if(sort === "charting") data = [...data].sort((a,b)=>b.chart-a.chart);
      if(sort === "following") data = [...data].sort((a,b)=>Number(isFollowing(b))-Number(isFollowing(a)));
      if(sort === "alphabetical") data = [...data].sort((a,b)=>a.name.localeCompare(b.name));

      document.getElementById("resultCount").textContent = data.length + " artist" + (data.length === 1 ? "" : "s");

      document.getElementById("artistList").innerHTML = data.map(a => {
        const init = initialsOf(a.name);
        const following = isFollowing(a.name);
        const peak = Math.max(1, Math.round((100 - a.chart) / 4));
        return `
          <div class="artist-row" onclick="location.href='artist.html?artist=${encodeURIComponent(a.name)}'">
            <div class="artist-avatar">${init}</div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:900;font-size:14px">${TrackHype.esc(a.name)}</div>
              <div style="font-size:12px;color:var(--th-muted)">${a.genre} · Active since ${a.year}</div>
              <div class="artist-stats"><span>#${a.chart} current</span><span>#${peak} peak</span>${a.status.map(s=>`<span>${s}</span>`).join("")}</div>
            </div>
            <button class="follow-btn ${following?"is-following":""}" type="button" onclick="event.stopPropagation();toggleFollow('${a.name.replace(/'/g,"\\'")}',this)">${following?"Following":"Follow"}</button>
          </div>`;
      }).join("") || '<div class="th-empty"><strong>No artists match these filters.</strong>Try another genre, year or status.</div>';
    }

renderAZ();
    const qp = new URLSearchParams(location.search);
    const qGenre = qp.get("genre");
    const qFilter = qp.get("filter");
    const genreSel = document.getElementById("genre");
    if(qGenre && [...genreSel.options].some(o => o.value === qGenre)){ genreSel.value = qGenre; }
    if(qFilter === "following"){ document.getElementById("status").value = "Following"; }
    ["genre","status","year","sort"].forEach(id => document.getElementById(id).addEventListener("change", render));
    render();
  </script>
</body>
</html>
