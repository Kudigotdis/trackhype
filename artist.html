<!doctype html>
<html lang="en-ZW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TrackHype">
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
  </script>
  <link rel="icon" type="image/webp" href="Assets/logos/TrackHype Logo Design Badge.webp">
  <title>Artist — TrackHype</title>
  <link rel="stylesheet" href="trackhype.css">
  <style>
body[data-active-nav="artists.html"] .th-shell{gap:14px;padding-top:0}
    .ar-hero{position:relative;margin:0 -16px}
    .ar-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--th-grey-2)}
    .ar-carousel::-webkit-scrollbar{display:none}
    .ar-avatar{flex:none;width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--th-grey-2)}
    .ar-dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px;z-index:1}
    .ar-dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.45;transition:opacity .2s ease;padding:0;border:0}
    .ar-dot.is-active{opacity:1}
    .ar-info{padding:16px 16px 0}
    .ar-bio{font-size:13px;line-height:1.7;color:var(--th-muted);white-space:pre-line}
    .ar-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid var(--th-border-soft)}
    .ar-row:last-child{border-bottom:0}
    .ar-thumb{flex:none;width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--th-grey-2)}
    .ar-accordion{display:flex;flex-direction:column;gap:10px}
    .ar-accordion summary{list-style:none;cursor:pointer;text-align:center;font-size:17px;font-weight:900;color:var(--th-text);padding:12px;background:rgba(15,25,40,.10);border-radius:3px;-webkit-user-select:none;user-select:none}
    .ar-accordion summary::-webkit-details-marker{display:none}
    .ar-vote{flex:none;width:30px;height:30px;display:grid;place-items:center}
    .ar-vote img,.ar-vote button{width:22px;height:22px;object-fit:contain;padding:0;border:0;background:none;cursor:pointer}
    .ar-links{display:flex;justify-content:space-between;gap:10px;padding:0}
    .ar-links a{flex:1;display:grid;place-items:center}
    .ar-links img{width:26px;height:26px;object-fit:contain}
    #genres{display:flex;align-items:center;flex-wrap:wrap;gap:0}
    #genres .th-chip{background:none!important;border:0;padding:0;border-radius:0;font-size:13px;font-weight:800;color:var(--th-text)}
    #genres .th-chip-sep{color:#c7cdd6;font-weight:800;padding:0 6px}
    .ar-back{margin-top:8px}
  </style>
</head>
<body data-active-nav="artists.html">

  <header class="th-header" data-app-header>
<div class="th-header-inner">
      <a class="th-brand" href="index.html">
        <img class="th-logo-badge" src="Assets/logos/TrackHype Logo Design Badge.webp" alt="TrackHype">
        <img class="th-logo-text" src="Assets/logos/track-hype-text-logo.webp" alt="TrackHype">
      </a>
    </div>
  </header>

  <main class="th-app">
    <div class="th-shell">

<section class="ar-hero">
        <div class="ar-carousel" id="artistCarousel">
          <img class="ar-avatar" src="Assets/charts/top_40_chart/1.jpg" alt="Image 1">
          <img class="ar-avatar" src="Assets/charts/top_20_house/1.jpg" alt="Image 2">
          <img class="ar-avatar" src="Assets/charts/top_20_rnb_chart/1.jpg" alt="Image 3">
        </div>
        <div class="ar-dots">
          <button class="ar-dot is-active" type="button" data-dot="0" aria-label="Image 1 of 3"></button>
          <button class="ar-dot" type="button" data-dot="1" aria-label="Image 2 of 3"></button>
          <button class="ar-dot" type="button" data-dot="2" aria-label="Image 3 of 3"></button>
        </div>
        <div class="ar-info">
          <div style="font-size:24px;font-weight:900" id="artistName">Zimbabwe Artist</div>
          <div style="font-size:13px;color:var(--th-muted);margin-top:4px">Zimbabwe · <span id="artistGenre">Genre</span></div>
          <div style="display:flex;gap:7px;margin-top:10px">
            <button class="th-btn primary" style="flex:1" type="button" id="followBtn" onclick="toggleFollow()">Follow</button>
            <button class="th-btn secondary" style="flex:1" type="button" onclick="TrackHype.navigate('song.html?id=1')">Top Song</button>
          </div>
        </div>
      </section>

<section class="th-section">
        <div class="th-section-head"><h2>About</h2></div>
        <div class="th-card pad">
          <p class="ar-bio">Artist profile, approved biography, current activity, genre identity and official links will appear here.</p>
        </div>
      </section>

      <section class="th-section">
        <div class="ar-links">
          <a href="#" target="_blank" rel="noopener" title="YouTube"><img src="Assets/icons/YouTube_On.png" alt=""></a>
          <a href="#" target="_blank" rel="noopener" title="Spotify"><img src="Assets/icons/Spotify_icon.svg.webp" alt=""></a>
          <a href="#" target="_blank" rel="noopener" title="Instagram"><img src="Assets/icons/Instagram_On.png" alt=""></a>
          <a href="#" target="_blank" rel="noopener" title="TikTok"><img src="Assets/icons/TikTok_On.png" alt=""></a>
        </div>
      </section>

      <section class="th-section">
        <details class="ar-accordion" id="accGenres">
          <summary>Genres</summary>
          <div class="th-card pad"><div class="th-chip-row" id="genres"></div></div>
        </details>
      </section>

      <section class="th-section">
        <details class="ar-accordion" id="accSongs">
          <summary>Top Songs</summary>
          <div class="th-card" id="songs"></div>
        </details>
      </section>

      <section class="th-section">
        <details class="ar-accordion" id="accCharts">
          <summary>Current Charts</summary>
          <div class="th-card" id="chartsList"></div>
        </details>
      </section>

      <section class="th-section">
        <details class="ar-accordion" id="accHistory">
          <summary>Chart History</summary>
          <div class="th-card" id="historyList"></div>
        </details>
      </section>

      <section class="th-section">
        <details class="ar-accordion" id="accReleases">
          <summary>Latest Releases</summary>
          <div class="th-card" id="releasesList"></div>
        </details>
      </section>

      <section class="th-section">
        <details class="ar-accordion" id="accNewMusic">
          <summary>New Music</summary>
          <div class="th-card" id="newMusicList"></div>
        </details>
      </section>

      <section class="th-section">
        <button class="th-btn primary block ar-back" type="button" onclick="history.back()">Back</button>
      </section>

    </div>
  </main>

  <div class="bottom-swipe" data-bottom-swipe>
    <nav class="bottom-nav" data-bottom>
      <div class="bottom-nav-inner" data-nav-host></div>
    </nav>

    <aside class="promo-player" data-player></aside>
  </div>

  <div class="th-modal-backdrop" data-modal>
    <div class="th-sheet" role="dialog" aria-modal="true">
      <div class="th-sheet-handle"></div>
      <h3 data-modal-title></h3>
      <div data-modal-body></div>
      <div class="th-sheet-actions" data-modal-actions></div>
    </div>
  </div>

  <script src="demo-playlist.js"></script>
  <script src="trackhype.js"></script>
  <script>
    const name = new URLSearchParams(location.search).get("artist") || "Zimbabwe Artist";
    const GENRE_BY_NAME = {
      "Alick Macheso":"Sungura","Holy Ten":"Zim Hip Hop","Feli Nandi":"Afro-Pop","Jah Prayzah":"Afro-Pop",
      "T Gonzi":"Zim Hip Hop","Freeman HKD Boss":"Zimdancehall","Tocky Vibes":"Zimdancehall","Mambo Dhuterere":"Gospel",
      "Saintfloew":"Zim Hip Hop","Jah Master":"Zimdancehall","Andy Muridzo":"Afro-Pop","Janet Manyowa":"Gospel",
      "Nutty O":"Afro-Pop","Alexio Kawara":"Afro-Jazz","Enzo Ishall":"Zimdancehall","Mokoomba":"Afro-Jazz",
      "Takura":"R&B","Gemma Griffiths":"Amapiano","Minister Mahendere":"Gospel","Judgement Yard":"House"
    };
    const genre = GENRE_BY_NAME[name] || "Zim Hip Hop";

document.title = name + " — TrackHype";
    document.getElementById("artistName").textContent = name;
    document.getElementById("artistGenre").textContent = genre;

document.getElementById("genres").innerHTML = [genre, "Zimbabwe", "Officially Charting"]
      .map((g, i) => (i ? '<span class="th-chip-sep">-</span>' : "") + `<span class="th-chip">${TrackHype.esc(g)}</span>`).join("");

    function songChartKey(s){ return TrackHype.chartId(s.chart || "National Top 100"); }
    function songChartId(s){
      return String(s.id || "demo-" + TrackHype.chartId((s.artist || "") + " - " + (s.title || "")));
    }
    function isSongVotedInChart(s){
      const key = songChartKey(s);
      const sid = songChartId(s);
      const ballots = typeof TrackHype.getWeekBallots === "function"
        ? TrackHype.getWeekBallots(key, TrackHype.currentWeekKey())
        : [];
      if(ballots.some(b => (b.picks || []).some(p => String(p.submissionId) === sid))){ return true; }
      if(typeof TrackHype.isSingleVote === "function"){
        const v = TrackHype.isSingleVote(key);
        if(v && String(v.songId) === sid){ return true; }
      }
      return false;
    }
    function songVoteIcon(s, list, i){
      if(isSongVotedInChart(s)){
        return `<div class="ar-vote" data-vote-cell data-vote-list="${list}" data-vote-i="${i}"><img src="Assets/icons/New_Song_Chart_Icon.webp" alt="In chart" title="In chart"></div>`;
      }
      return `<div class="ar-vote" data-vote-cell data-vote-list="${list}" data-vote-i="${i}"><button type="button" title="Vote to enter ${TrackHype.esc(s.chart || "National Top 100")}" onclick="voteArtistSong('${list}', ${i})"><img src="Assets/icons/New_Song_Chart_Vote_Icon.webp" alt="Vote for chart"></button></div>`;
    }
    window.voteArtistSong = (list, i) => {
      const s = SONG_LISTS[list] && SONG_LISTS[list][i];
      if(!s){ return; }
      const chart = s.chart || "National Top 100";
      TrackHype.confirmVoteSheet(chart, { id: songChartId(s), title: s.title, artist: s.artist, rank: 1 }, TrackHype.maxForChart(chart));
    };

    const SONG_LISTS = { top: [], releases: [], recent: [] };

    const topSongs = Array.from({length:5},(_,i) => {
      const r = i + 1;
      return { id: r, title: name + " — Track " + r, artist: name };
    });
    SONG_LISTS.top = topSongs;
    document.getElementById("songs").innerHTML = topSongs.map((s,i) => `
        <div class="ar-row" onclick="TrackHype.navigate('song.html?id=${s.id}')" style="cursor:pointer">
          ${songVoteIcon(s, "top", i)}
          <div style="flex:1;min-width:0">
            <div style="font-weight:800;font-size:13px">${TrackHype.esc(s.title)}</div>
            <div style="font-size:12px;color:var(--th-muted)">Charting · ${21 - (i + 1)} pts</div>
          </div>
          <span style="color:var(--th-primary)">›</span>
        </div>`).join("");

document.getElementById("historyList").innerHTML = Array.from({length:6},(_,i) => `
      <div class="th-table-row" style="grid-template-columns:1.4fr 1fr auto">
        <div><strong>Top 20 Chart · Week ${i+1}</strong><span style="display:block">Peak #${i+1} · 2026</span></div>
        <span>${["JAN","FEB","MAR","APR","MAY","JUN"][i]} 2026</span>
        <span class="th-status success">Charting</span>
      </div>
    `).join("");

    const CHART_SLOTS = [
      {chart:"Single Top 40 Chart", pos:1},
      {chart:"Regional Singles Chart", pos:2},
      {chart:"National Top 100 Chart", pos:3}
    ];
    document.getElementById("chartsList").innerHTML = CHART_SLOTS.map(s => `
      <div class="ar-row" onclick="TrackHype.navigate('charts.html?chart=${encodeURIComponent(s.chart)}')" style="cursor:pointer">
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:13px">${TrackHype.esc(s.chart)}</div>
          <div style="font-size:12px;color:var(--th-muted)">${TrackHype.esc(name)} is charting now</div>
        </div>
        <span style="color:var(--th-primary)">›</span>
      </div>
    `).join("");

    const mySongs = (TrackHype.CATALOG && TrackHype.CATALOG.songs || [])
      .filter(s => s.artist === name).slice(0, 5);

    const releaseRows = (mySongs.length ? mySongs : Array.from({length:3},(_,i)=>({
      id: i + 1, title: name + " — Track " + (i + 1), artist: name,
      dateAdded: ["2026-08-20","2026-08-14","2026-07-30"][i] || "2026-08-01"
    })));
    SONG_LISTS.releases = releaseRows.map(s => ({...s, chart: s.chart || "National Top 100"}));
    document.getElementById("releasesList").innerHTML = SONG_LISTS.releases.map((s,i) => `
      <div class="ar-row" onclick="TrackHype.navigate('song.html?id=${TrackHype.esc(s.id)}')" style="cursor:pointer">
        ${songVoteIcon(s, "releases", i)}
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:13px">${TrackHype.esc(s.title || (s.artist + " — Track " + s.id))}</div>
          <div style="font-size:12px;color:var(--th-muted)">Released ${TrackHype.fmtDate ? TrackHype.fmtDate(s.dateAdded) : s.dateAdded}</div>
        </div>
        <span style="color:var(--th-primary)">›</span>
      </div>
    `).join("");

    const newRows = (mySongs.length ? mySongs : Array.from({length:3},(_,i)=>({
      id: i + 1, title: name + " — Track " + (i + 1), artist: name
    })));
    SONG_LISTS.recent = newRows.map(s => ({...s, chart: s.chart || "National Top 100"}));
    document.getElementById("newMusicList").innerHTML = SONG_LISTS.recent.map((s,i) => `
      <div class="ar-row" onclick="TrackHype.navigate('song.html?id=${TrackHype.esc(s.id)}')" style="cursor:pointer">
        ${songVoteIcon(s, "recent", i)}
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:13px">${TrackHype.esc(s.title || (s.artist + " — Track " + s.id))}</div>
          <div style="font-size:12px;color:var(--th-muted)">New release on TrackHype</div>
        </div>
        <span style="color:var(--th-primary)">›</span>
      </div>
    `).join("");

    function refreshVoteCells(){
      ["top","releases","recent"].forEach(list => {
        const arr = SONG_LISTS[list] || [];
        arr.forEach((s, i) => {
          document.querySelectorAll(`[data-vote-list="${list}"][data-vote-i="${i}"]`).forEach(cell => {
            cell.innerHTML = songVoteIcon(s, list, i);
          });
        });
      });
    }
    document.addEventListener("trackhype:chart-update", refreshVoteCells);

    const carousel = document.getElementById("artistCarousel");
    const dots = [...document.querySelectorAll(".ar-dot")];
    if(carousel && dots.length){
      function syncDots(){
        const i = Math.min(dots.length - 1, Math.max(0, Math.round(carousel.scrollLeft / (carousel.clientWidth || 1))));
        dots.forEach((d, k) => d.classList.toggle("is-active", k === i));
      }
      let raf = 0;
      carousel.addEventListener("scroll", () => {
        if(raf){ return; }
        raf = requestAnimationFrame(() => { raf = 0; syncDots(); });
      });
      dots.forEach(d => d.addEventListener("click", () => {
        carousel.scrollTo({ left: Number(d.dataset.dot) * carousel.clientWidth, behavior: "smooth" });
      }));
      syncDots();
    }

    function renderFollow(){
      const following = (TrackHype.getState().followingArtists || []).includes(name);
      const btn = document.getElementById("followBtn");
      btn.textContent = following ? "Following" : "Follow";
      btn.classList.toggle("primary", !following);
    }

    window.toggleFollow = () => {
      TrackHype.updateState(s => {
        s.followingArtists = s.followingArtists || [];
        const i = s.followingArtists.indexOf(name);
        if(i >= 0){ s.followingArtists.splice(i,1); TrackHype.toast("Unfollowed " + name); }
        else { s.followingArtists.push(name); TrackHype.toast("Following " + name); }
      });
      renderFollow();
    };

    renderFollow();
  </script>
</body>
</html>
