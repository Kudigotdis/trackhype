<!doctype html>
<html lang="en-ZW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TrackHype">
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
  </script>
  <link rel="icon" type="image/webp" href="Assets/logos/TrackHype Logo Design Badge.webp">
  <title>TrackHype</title>

  <meta property="og:title" content="TrackHype - SADC Music Charts">
  <meta property="og:description" content="Discover, vote and chart the biggest music across Southern Africa.">
  <meta property="og:image" content="Assets/logos/TrackHype Logo Design Badge.webp">
  <meta property="og:url" content="https://trackhype.github.io/trackhype/landing.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="trackhype.css">
  <style>
    body{margin:0;background:#fff;color:var(--th-text);font-family:var(--th-font);display:flex;flex-direction:column;min-height:100vh;-webkit-tap-highlight-color:transparent}
    .sp-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
    .sp-logo{width:min(340px,76vw);height:auto;filter:drop-shadow(0 12px 30px rgba(1,219,139,.18))}
    .sp-name{margin-top:26px;font-size:30px;font-weight:900;letter-spacing:.5px;color:var(--th-primary-dark)}
    .sp-tag{margin-top:8px;font-size:14px;color:var(--th-muted);font-weight:700;line-height:1.6}
    .sp-btns{display:flex;flex-direction:column;gap:12px;width:min(320px,84vw);margin-top:34px}
.sp-small{margin-top:18px;font-size:12px;color:var(--th-faint)}
    .thumb{display:flex;gap:10px;justify-content:center;margin-top:24px}
    .thumb img{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--th-border-soft)}
  </style>
</head>
<body>

  <main class="sp-wrap">
    <img class="sp-logo" src="Assets/logos/TrackHype Logo Design.png" alt="TrackHype">
    <h1 class="sp-name">TrackHype</h1>
    <div class="sp-tag">Zimbabwe's music discovery space.<br>Charts, new music, artists and votes.</div>

    <div class="thumb">
      <img src="Assets/charts/top_40_chart/1.jpg" alt="">
      <img src="Assets/charts/top_25_local_hip_hop/1.jpg" alt="">
      <img src="Assets/charts/top_20_house/1.jpg" alt="">
      <img src="Assets/charts/top_20_rnb_chart/1.jpg" alt="">
    </div>

    <div class="sp-btns">
      <button class="th-btn primary" type="button" onclick="location.href='onboarding.html'">GET STARTED</button>
      <button class="th-btn secondary" type="button" onclick="location.href='index.html'">EXPLORE TRACKHYPE</button>
    </div>

    <div class="sp-small">Your gateway to Zimbabwean music &amp; artists</div>
  </main>

<script src="demo-playlist.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/tracker.js"></script>
<script src="trackhype.js"></script>
</body>
</html>
