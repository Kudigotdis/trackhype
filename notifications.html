<!doctype html>
<html lang="en-ZW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TrackHype">
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
  </script>
  <link rel="icon" type="image/webp" href="Assets/logos/TrackHype Logo Design Badge.webp">
  <title>Notifications — TrackHype</title>

  <meta property="og:title" content="Notifications - TrackHype">
  <meta property="og:description" content="Chart results, artist updates and new releases in one place.">
  <meta property="og:image" content="Assets/logos/TrackHype Logo Design Badge.webp">
  <meta property="og:url" content="https://trackhype.github.io/trackhype/notifications.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="trackhype.css">
  <style>
    .pg-kicker{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--th-primary-dark);text-align:center}
    .pg-title{font-size:24px;font-weight:900;color:var(--th-text);margin-top:4px;text-align:center}
    .pg-sub{font-size:13px;color:var(--th-muted);margin-top:6px;line-height:1.6;text-align:center}
  </style>
</head>
<body data-active-nav="menu.html">

  <header class="th-header" data-app-header>
    <div class="th-header-inner">
      <a class="th-brand" href="index.html">
        <img class="th-logo-badge" src="Assets/logos/TrackHype Logo Design Badge.webp" alt="TrackHype">
        <img class="th-logo-text" src="Assets/logos/track-hype-text-logo.webp" alt="TrackHype">
      </a>
    </div>
  </header>

  <main class="th-app">
    <div class="th-shell">

      <section>
        <div class="pg-kicker">Account</div>
        <h1 class="pg-title">Notifications</h1>
        <p class="pg-sub">Chart results, artist updates and new releases will appear here.</p>
      </section>

      <section>
        <div class="th-card pad">
          <div style="font-weight:900">Notification settings</div>
          <p style="margin:6px 0 0;font-size:13px;color:var(--th-muted)">Choose what you want to hear about — chart results, artist updates and new releases — right from this screen.</p>
        </div>
      </section>

    </div>
  </main>

  <div class="bottom-swipe" data-bottom-swipe>
    <nav class="bottom-nav" data-bottom>
      <div class="bottom-nav-inner" data-nav-host></div>
    </nav>

    <aside class="promo-player" data-player></aside>
  </div>

  <div class="th-modal-backdrop" data-modal>
    <div class="th-sheet" role="dialog" aria-modal="true">
      <div class="th-sheet-handle"></div>
      <h3 data-modal-title></h3>
      <div data-modal-body></div>
      <div class="th-sheet-actions" data-modal-actions></div>
    </div>
  </div>

  <script src="demo-playlist.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/tracker.js"></script>
<script src="trackhype.js"></script>
</body>
</html>
